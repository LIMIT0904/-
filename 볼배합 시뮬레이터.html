<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>볼배합 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 투구 차트 클립보드: 가운데 큰 존(투수 시점), 왼쪽 타자 리포트, 오른쪽 투구 기록 */
  --paper:#e5e9ed;
  --card:#f8fafb;
  --ink:#14213d;
  --muted:#5d6b7e;
  --line:#c4ccd5;
  --seam:#c8102e;
  --display:'Black Han Sans','IBM Plex Sans KR',sans-serif;
  --body:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper);
  background-image:
    linear-gradient(rgba(20,33,61,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(20,33,61,.05) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:3px solid var(--seam);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{max-width:1320px;margin:0 auto;padding:24px 20px 48px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}

/* ---------- 빌드 화면 ---------- */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:3px solid var(--ink);position:relative}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:6px;
  background:repeating-linear-gradient(90deg,var(--seam) 0 7px,transparent 7px 14px);opacity:.8}
.eyebrow{margin:0 0 6px;font-size:13px;color:var(--muted);letter-spacing:.08em}
.mast h1{font-size:clamp(34px,5vw,56px);line-height:1}
.lede{margin:10px 0 0;max-width:60ch;color:var(--muted)}
.setup{display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px;margin:30px 0 8px;
  background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;position:sticky;top:8px;z-index:5;box-shadow:0 2px 0 rgba(20,33,61,.06)}
.field{display:flex;flex-direction:column;gap:6px}
.field.grow{flex:1;min-width:200px}
.flabel{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.flabel b{color:var(--ink);font-size:15px}
.warn{color:var(--seam);font-style:normal;font-weight:700}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 13px;display:flex;flex-direction:column;align-items:center;line-height:1.2;border-right:1.5px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button small{font-size:11px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--card)}
.seg button.on small{color:#b9c3d3}
.seg.small button{padding:4px 10px;font-size:13px}
.meter{height:12px;border:1.5px solid var(--ink);border-radius:3px;background:var(--card);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);transition:width .2s}
.meter.over i{background:var(--seam)}
.primary{background:var(--seam);color:#fff;border:0;border-radius:5px;padding:12px 22px;font-weight:700;font-size:16px;box-shadow:0 3px 0 #8d0b20}
.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #8d0b20}
.ghost{background:transparent;border:1.5px solid var(--ink);border-radius:5px;padding:9px 16px;font-weight:500}
.hint{color:var(--muted);font-size:13px;margin:8px 2px 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;border-top:5px solid var(--pc)}
.pcard.off{background:rgba(248,250,251,.6)}
.pcard .top{display:flex;gap:12px;align-items:flex-start}
.pcard .top .txt{flex:1}
.pcard h3{font-size:20px}
.pcard .meta{font-size:12.5px;color:var(--muted)}
.pcard .desc{font-size:13px;margin:4px 0 0}
.minis{display:flex;gap:8px;flex:none}
.minis figure{margin:0;width:60px;text-align:center}
.minis figcaption{font-size:10.5px;color:var(--muted);margin-bottom:2px;white-space:nowrap}
.mini{width:100%}
.cmini{width:34px;flex:none;display:block}
.pchip.on .cmini .zc{opacity:.95}
.stat{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center}
.stat .nm{font-size:13px;font-weight:700}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:10px;border:1.2px solid var(--ink);border-radius:2px}
.pips i.f{background:var(--pc)}
.stat .ctl{display:flex;align-items:center;gap:4px}
.stat .ctl button{width:28px;height:28px;border:1.5px solid var(--ink);background:var(--card);border-radius:4px;font-weight:700;line-height:1;position:relative}
.stat .ctl .cost{font-size:10px;position:absolute;top:-13px;left:0;right:0;text-align:center;color:var(--muted);font-weight:500}
.stat .val{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-4px}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.linkbtn{background:none;border:0;color:var(--seam);text-decoration:underline;padding:0;font-size:12.5px}
.buy{align-self:flex-start;background:var(--ink);color:var(--card);border:0;border-radius:4px;padding:8px 14px;font-weight:700}
.rules{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.rules article{border-left:3px solid var(--ink);padding:2px 0 2px 14px}
.rules h3{font-size:17px;margin-bottom:6px}
.rules ul,.rules ol{margin:0;padding-left:18px;font-size:13.5px;color:#2b3955}
.rules li{margin:2px 0}

/* ---------- 투수진 ---------- */
.staff{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(300px,1.7fr);gap:10px;margin:14px 0 6px;align-items:stretch}
.stab{border:1.5px solid var(--ink);background:var(--card);border-radius:6px;padding:9px 12px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;min-width:0}
.stab b{font-family:var(--display);font-weight:400;font-size:18px}
.stab small{grid-column:1/-1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stab span{grid-row:1;grid-column:2;font-size:12.5px}
.stab.on{background:var(--ink);color:var(--card);box-shadow:inset 0 -4px 0 var(--seam)}
.stab.on small{color:#b9c3d3}
.stab.over span{color:var(--seam);font-weight:700}
.stamina{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 14px 10px;display:flex;align-items:center}
.stamina{flex-direction:column;align-items:stretch;gap:10px}
.stamina .stat{width:100%}
.handsel{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.handsel .nm{font-size:13px;font-weight:700;width:40px}
.handsel .hnote{font-size:12px;color:var(--muted)}
.stab b em{font-style:normal;font-family:var(--body);font-size:12px;opacity:.75;margin-left:4px}
.matchup{margin:6px 0 0;font-size:12px;font-weight:700;padding:3px 8px;border-radius:3px;display:inline-block}
.matchup.adv{color:#1d6b4a;background:#eef8f2}
.matchup.dis{color:var(--seam);background:#fdf0f2}
@media (max-width:900px){ .staff{grid-template-columns:repeat(3,minmax(0,1fr))} .stamina{grid-column:1/-1} }
.runners{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.rrow{display:grid;grid-template-columns:30px 1fr auto auto;gap:8px;align-items:center;font-size:12.5px}
.rrow .rb{font-family:var(--mono);color:#ffd166;font-weight:600}
.rrow .rn{color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rs{color:#9fb0c8;font-size:11.5px;white-space:nowrap}
.rrow .rs.warn{color:#ff9aa8;font-weight:700}
.callout .steal{font-size:13px;font-weight:700;margin-top:3px;color:var(--ink)}
.callout .steal.good{color:#1d6b4a}
.callout .steal.bad{color:var(--seam)}
.mound{margin-top:12px;padding-top:10px;border-top:1px solid #2c3b5b}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.mrow b{font-family:var(--display);font-weight:400;font-size:17px;color:#fff}
.mrow.small{font-size:11.5px;color:#9fb0c8;margin-top:6px}
.sbar{height:7px;border-radius:4px;background:#2c3b5b;margin-top:6px;overflow:hidden}
.sbar i{display:block;height:100%;transition:width .3s}
.penbtn{background:transparent;border:1.5px solid #9fb0c8;color:#e9eef5;border-radius:4px;padding:3px 9px;font-size:12px;flex:none}
.pen{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.penrow{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:5px;padding:8px 10px;background:#fff}
.penp{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin-top:4px}
.penp i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.primary.small{padding:7px 14px;font-size:14px;flex:none}
.pchip small.tired{color:var(--seam)}
.pchip.on small.tired{color:#ff9aa8}
.glog li.subl{font-weight:700;background:rgba(200,16,46,.05)}

/* ---------- 존 그리드 ---------- */
.zg{display:grid;position:relative;
  grid-template-columns:.62fr 1fr 1fr 1fr .62fr;grid-template-rows:.62fr 1fr 1fr 1fr .62fr;
  grid-template-areas:"a13 a9 a9 a9 a14" "a11 a0 a1 a2 a12" "a11 a3 a4 a5 a12" "a11 a6 a7 a8 a12" "a15 a10 a10 a10 a16";
  gap:3px;aspect-ratio:1/1.05}
.zc{position:relative;border-radius:3px;background:rgba(255,255,255,.75);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;min-width:0}
.zc.out{background:rgba(255,255,255,.4);border-style:dashed}
.zframe{grid-area:2/2/5/5;border:3px solid var(--ink);border-radius:3px;pointer-events:none;margin:-3px}
.zg.mini{gap:1.5px}
.zg.pv{transform:scaleX(-1)}
.zg.mini .zc{border:0;border-radius:1.5px}
.zg.mini .zframe{border-width:1.5px;margin:-1.5px}

.zg.bat .zc{font-family:var(--mono);font-size:13px;font-weight:600}
.zg.bat .zc small{font-size:10px;font-weight:400;opacity:.8}
.zg.bat .zframe{border-width:2px;margin:-2px}

.zonewrap{position:relative;max-width:640px;margin:0 auto;width:100%;display:grid;grid-template-columns:76px minmax(0,1fr) 76px;column-gap:6px;align-items:end}
.zonewrap .zg{grid-column:2;grid-row:1}
.zonewrap .plate{grid-column:2;grid-row:2}
.zonewrap .platecap{grid-column:2;grid-row:3}
.side{grid-row:1;align-self:stretch;display:flex;align-items:flex-start;justify-content:center;min-width:0;padding-top:2px}
.side.l{grid-column:1}.side.r{grid-column:3}
.sil{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;color:var(--ink)}
.sil span{font-family:var(--display);font-size:15px;line-height:1}
.sil small{font-size:11.5px;color:var(--muted);margin-top:-2px}
.tdesc{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.lsil{display:block;height:34px;margin:1px 0}
.lsil svg{height:100%;width:auto}
.lineup div.cur .lsil{color:var(--card)}
.batfig{position:absolute;bottom:-4%;height:110%;aspect-ratio:76/218;pointer-events:none;z-index:4;color:var(--ink)}
.batfig.r{right:-20%}.batfig.l{left:-20%}
.batfig.faint svg{opacity:.3}
.batfig .lab{position:absolute;top:-2%;transform:translateX(-50%);font-family:var(--display);font-size:16px;line-height:1.1;text-align:center;white-space:nowrap;color:var(--ink)}
.batfig.r .lab{left:61%}.batfig.l .lab{left:39%}
.batfig .lab small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted)}
.batfig svg{display:block;width:100%;height:100%;opacity:.8;filter:drop-shadow(0 2px 2px rgba(20,33,61,.25))}
.reveal{font-size:12.5px;color:var(--muted);margin-top:4px}
.reveal b{font-family:var(--mono);color:var(--ink)}
.lineup .hd{display:block;font-size:10px;opacity:.75}
.zg.target .zc{cursor:pointer;transition:transform .08s}
.zg.target .zc:hover{transform:scale(1.025);z-index:2}
.zg.target .zc.sel{outline:3.5px solid var(--ink);outline-offset:1px;z-index:3}
.zg.target .zc.sel::before,.zg.target .zc.sel::after{content:"";position:absolute;background:var(--ink);opacity:.35}
.zg.target .zc.sel::before{left:50%;top:12%;bottom:12%;width:1.5px}
.zg.target .zc.sel::after{top:50%;left:12%;right:12%;height:1.5px}
.zg.target .ov{font-family:var(--mono);font-size:15px;font-weight:600;line-height:1}
.zg.target .zn{font-size:10.5px;opacity:.7;margin-top:3px}
.mk{position:absolute;width:21px;height:21px;margin:-10.5px 0 0 -10.5px;border-radius:50%;background:var(--mc);color:#fff;font:600 11px/17px var(--mono);text-align:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);z-index:6;pointer-events:none}
/* 93칸 존 */
.fg{position:relative;width:100%;aspect-ratio:1/1}
.fc{position:absolute;z-index:1;box-shadow:inset 0 0 0 .6px rgba(20,33,61,.22);background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;overflow:hidden;line-height:1.1}
.fc.out{background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 .5px rgba(20,33,61,.12)}
.fc.d1{background:rgba(255,255,255,.4)}
.fc.d2{background:rgba(255,255,255,.25)}
.fgrid{position:absolute;outline:3px solid var(--ink);pointer-events:none;z-index:3}
.fgrid i{position:absolute;background:rgba(20,33,61,.45)}
.fgrid i.v{top:0;bottom:0;width:1.5px;margin-left:-.75px}
.fgrid i.h{left:0;right:0;height:1.5px;margin-top:-.75px}
.fg.target .fc{cursor:pointer}
.fg.target .fc:hover{box-shadow:inset 0 0 0 2px var(--seam);z-index:2}
.fg.target .fc.sel{box-shadow:inset 0 0 0 2.5px var(--ink);z-index:3}
.fg.target .fc.sel::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(20,33,61,.28) 0 2px,transparent 2px 5px)}
.fg .ov{font:600 10.5px var(--mono)}
.fg .bl{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;color:var(--muted);pointer-events:none;z-index:2;white-space:nowrap;text-shadow:0 0 3px var(--paper),0 0 3px var(--paper)}
.fgsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5}
.fgsvg .r2{fill:none;stroke:var(--ink);stroke-width:.06;stroke-dasharray:.22 .16;opacity:.8}
.fgsvg .r1{fill:rgba(20,33,61,.07);stroke:var(--ink);stroke-width:.05;opacity:.85}
.fgsvg .ml{stroke:var(--seam);stroke-width:.07;stroke-dasharray:.18 .12}
.fgsvg .mt{fill:none;stroke:var(--seam);stroke-width:.07}
.fg.bat .fc{box-shadow:none}
.fg.bat .bv{font:600 10.5px var(--mono)}
.fg.bat .fgrid{outline-width:2px}
.blk.o{font-weight:400;font-size:10.5px}
.blk{position:absolute;transform:translate(-50%,-50%);font:600 12px var(--mono);color:var(--ink);background:rgba(251,252,253,.82);border-radius:3px;padding:0 3px;line-height:1.35;pointer-events:none;z-index:3}
.mk.fresh{animation:arrive .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes arrive{from{transform:scale(2.6);opacity:0}to{transform:scale(1);opacity:1}}
.plate{display:block;width:30%;margin:10px auto 0}
.platecap{text-align:center;font-size:12px;color:var(--muted);margin-top:2px;min-height:1.5em}

/* ---------- 경기 화면 ---------- */
.gtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.gtop h1{font-size:28px}
.gtop .r{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.game{display:grid;grid-template-columns:290px minmax(0,1fr) 310px;gap:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
.panel+.panel{margin-top:14px}
.ph{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.board{background:var(--ink);color:#e9eef5;border-radius:6px;padding:12px 14px;border:0}
.board .ph{color:#9fb0c8}
.bres{margin:18px 0 6px}
.btable td{vertical-align:top;text-align:center}
.btable td.nm{text-align:left;white-space:nowrap}.btable td.nm small{display:block;font-size:11.5px}
.btable td.bo{font-family:var(--mono);font-weight:700}
.btable td.pas{text-align:left;min-width:280px}
.btable .pas span{display:inline-block;font-size:12px;padding:2px 7px;margin:2px 4px 2px 0;border-radius:3px;background:#eef1f6;color:var(--ink);white-space:nowrap}
.btable .pas span em{font-style:normal;color:var(--muted);margin-right:4px;font-size:11px}
.btable .pas span.h{background:#fdecef;color:var(--seam);font-weight:700}
.btable .pas span.hr{background:var(--seam);color:#fff;font-weight:700}.btable .pas span.hr em{color:#ffd9de}
.btable .pas span.k{background:#e8f4ee;color:#1d6b4a}
.btable .pas span.bb{background:#fff4dc;color:#8a6200}
.btable th:nth-child(2),.btable th:nth-child(3){text-align:left}
.btable tr.tot td{border-top:2px solid var(--ink);font-weight:700}
.lines{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;text-align:center}
.lines th{font-weight:400;color:#8ea0ba;padding:2px 0}
.lines td{padding:3px 0;border-top:1px solid #2c3b5b}
.lines td.now{color:#ffd166;font-weight:600}
.lines .tot{color:#fff;font-weight:600;border-left:1px solid #2c3b5b}
.bso{display:grid;grid-template-columns:auto auto;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.lights{display:grid;grid-template-columns:18px auto;gap:5px 8px;align-items:center;font:600 13px var(--mono)}
.lights span{display:flex;gap:5px}
.lights i{width:13px;height:13px;border-radius:50%;background:#2c3b5b}
.lights .b i.on{background:#3ecf6e;box-shadow:0 0 6px #3ecf6e}
.lights .s i.on{background:#ffd166;box-shadow:0 0 6px #ffd166}
.lights .o i.on{background:#ff4d5e;box-shadow:0 0 6px #ff4d5e}
.diamond{width:78px;height:62px}
.pcount{font-size:12px;color:#9fb0c8;margin-top:8px;display:flex;justify-content:space-between}
.pcount b{color:#fff;font-family:var(--mono)}
.bhead{display:flex;gap:12px;align-items:center}
.order{font-family:var(--display);font-size:34px;line-height:1;width:44px;height:44px;border:2.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center}
.bhead h2{font-size:24px;line-height:1.1}
.bhead p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.traits{display:flex;gap:6px;margin:8px 0 10px;flex-wrap:wrap}
.traits span{font-size:12px;border:1px solid var(--line);border-radius:3px;padding:2px 7px;background:#fff}
.traits b{font-family:var(--mono);margin-left:3px}
.cap{font-size:11.5px;color:var(--muted);margin:8px 0 0}
.scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:6px}
.scale i{flex:1;height:7px;border-radius:2px}
.lineup{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}

<body>
<div id="app"></div>
<script>
// ===== 볼배합 시뮬레이터 엔진 =====
// 엔진 좌표는 포수 시점(화면은 좌우를 뒤집어 투수 시점으로 그려요). 굵은 구역(타자 생성·구종 상성의 기준): 0~8 스트라이크존 (행: 높은/가운데/낮은, 열: 좌/중/우 — 포수 시점), 9 위 볼, 10 아래 볼, 11 좌 볼, 12 우 볼
const ZPOS = [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2],[-1,1],[3,1],[1,-1],[1,3]];
const ROWN = ['높은','가운데','낮은'], COLN = ['좌','중','우'];
// 포수 시점에서 우타자는 왼쪽(3루쪽) 타석, 좌타자는 오른쪽 타석에 서요.
function zoneName(z, hand){
  const inL = hand!=='L';               // 우타: 왼쪽 열이 몸쪽
  const colName = c => c===1 ? '가운데' : ((c===0)===inL ? '몸쪽' : '바깥쪽');
  if (z===4) return '한가운데';
  if (z<9){ const [r,c]=ZPOS[z];
    if (r===1) return colName(c);
    return ROWN[r]+' '+colName(c);
  }
  if (z===9) return '높은 볼'; if (z===10) return '낮은 볼';
  if (z>=13) return (z<15?'높은 ':'낮은 ')+colName(z===13||z===15?0:2)+' 볼';
  return colName(z===11?0:2)+' 볼';
}
const ZONE_NAMES = ZPOS.map((_,z)=>zoneName(z,'R'));

const PITCHES = {
  FF:{name:'포심 패스트볼',short:'포심',cost:2,v0:138,dv:1.6,fast:true,color:'#c8102e',
      desc:'높은 존에서 위력이 가장 커요. 낮게 몰리면 맞아요.',
      aff:[.6,.5,.6, .1,-.2,.1, -.4,-.6,-.4, .6,-.5,0,0],
      affL:[.6,.5,.6, .1,-.2,.1, -.4,-.6,-.4, .6,-.5,0,0]},
  SI:{name:'투심 패스트볼',short:'투심',cost:2,v0:136,dv:1.5,fast:true,gb:true,color:'#d9822b',
      desc:'우타자 몸쪽으로 휘어 들어가며 가라앉아요. 좌타자에게는 바깥으로 흘러 위력이 줄어요.',
      aff:[-.3,-.4,-.3, .3,-.1,-.1, .6,.3,0, -.4,.3,.4,-.2],
      affL:[-.3,-.4,-.3, 0,-.1,-.2, .4,.3,-.1, -.4,.3,.2,-.3]},
  FC:{name:'커터',short:'커터',cost:3,v0:132,dv:1.5,fast:true,color:'#8c5a2b',
      desc:'우타자 바깥쪽, 좌타자 몸쪽(손잡이 쪽)으로 살짝 꺾여요.',
      aff:[.3,.2,.4, 0,-.2,.4, -.2,0,.3, .2,0,-.2,.4],
      affL:[.3,.2,.5, 0,-.2,.5, -.2,0,.3, .2,0,-.2,.5]},
  SL:{name:'슬라이더',short:'슬라이더',cost:3,v0:124,dv:1.4,color:'#2f5d9e',
      desc:'우타자 바깥쪽으로 휘어 나가요. 좌타자에게는 몸쪽 발끝으로 파고들지만 위력이 줄어요.',
      aff:[-.4,-.4,0, -.2,-.2,.4, 0,.3,.7, -.5,.4,-.3,.8],
      affL:[-.5,-.4,-.2, -.3,-.3,.1, -.1,.2,.4, -.5,.4,-.4,.4]},
  CU:{name:'커브',short:'커브',cost:3,v0:110,dv:1.4,color:'#6b4fa0',
      desc:'가장 느린 공. 직구와 구속 차이를 크게 벌려요.',
      aff:[-.5,-.5,-.5, -.1,-.2,-.1, .5,.6,.5, -.6,.8,0,.2],
      affL:[-.5,-.5,-.5, -.1,-.2,-.1, .4,.5,.4, -.6,.7,.1,.1]},
  CH:{name:'체인지업',short:'체인지업',cost:3,v0:122,dv:1.2,color:'#3c8d5a',
      desc:'직구처럼 오다 떨어지며 좌타자 바깥쪽으로 도망가요. 우타자 상대로는 위력이 줄어요.',
      aff:[-.5,-.6,-.5, -.1,-.2,-.1, .4,.4,.2, -.5,.6,.2,0],
      affL:[-.4,-.5,-.5, .1,-.1,-.1, .8,.6,.3, -.5,.8,.6,-.1]},
  FS:{name:'스플리터',short:'스플리터',cost:4,v0:126,dv:1.4,color:'#1f8a8a',
      desc:'아래 볼 구역으로 뚝 떨어지는 결정구. 좌우 가리지 않아요.',
      aff:[-.6,-.6,-.6, -.2,-.3,-.2, .6,.7,.6, -.6,.9,.1,.1],
      affL:[-.6,-.6,-.6, -.2,-.3,-.2, .6,.7,.6, -.6,.9,.2,0]},
};
const PITCH_ORDER = ['FF','SI','FC','SL','CU','CH','FS'];

// ----- 투구 유형(팔 각도) -----
// stuff: 구종별 구위 레벨 보정, velo: 구속(km/h) 보정, plat: 좌우 상성(플래툰) 효과 배율, gb: 땅볼 성향
const SLOTS = {
  over: {label:'오버핸드', desc:'포심·커브·스플리터가 강해요. 위에서 내리꽂아 낙차가 커요.',
         stuff:{FF:1, CU:1, FS:0.5, FC:0.5, SI:-0.5}, velo:{FF:1}, plat:1.0, gb:0},
  side: {label:'사이드암', desc:'투심·슬라이더가 강하고 커브는 약해요. 같은 손 타자에게 특히 강하고 반대 손 타자에게 약해요.',
         stuff:{SI:1, SL:1, CH:0.5, FF:-0.5, CU:-1, FS:-0.5}, velo:{FF:-3, SI:-3, FC:-3}, plat:1.5, gb:0.05},
  under:{label:'언더핸드', desc:'투심·체인지업이 강하고 떠오르는 커브가 쓸 만해요. 포심·스플리터는 약하고 구속이 느려요. 좌우 상성이 가장 극단적이에요.',
         stuff:{SI:1.5, CH:1, CU:0.5, FF:-1, SL:-0.5, FS:-1, FC:-0.5}, velo:{FF:-10, SI:-10, FC:-10, SL:-6, CH:-6, CU:-4, FS:-6}, plat:1.8, gb:0.08},
};
const slotOf = key => SLOTS[key] || SLOTS.over;

// ===== 15×15 격자 (225칸) =====
// 좌표(포수 시점): 스트라이크존은 x,y ∈ [0,9) (y는 아래로 갈수록 커짐). 바깥으로 3칸 두께의 볼 링이 둘러싸요(대각선 포함).
// 0~80: 스트라이크존 9×9 칸, 81~224: 볼 칸 144개. 굵은 볼 구역(위·아래·좌·우 각 3개 + 대각선 4개 = 16개)이 각각 3×3 = 9칸이에요.
const BAND = 3, NS = 81, GRID = 15;
const CELLS = [], LAT = [];
for (let r=0;r<9;r++) for (let c=0;c<9;c++) CELLS.push({x:c,y:r,w:1,h:1});
for (let gy=-3; gy<12; gy++) for (let gx=-3; gx<12; gx++){
  if (gx>=0&&gx<9&&gy>=0&&gy<9) continue;
  CELLS.push({x:gx,y:gy,w:1,h:1});
}
const NCELL = CELLS.length;
CELLS.forEach((c,i)=>{
  c.cx=c.x+0.5; c.cy=c.y+0.5; LAT[(c.y+3)*GRID+(c.x+3)] = i;
  if (i>=NS){
    c.ox = c.x<0 ? -1 : c.x>=9 ? 1 : 0;           // 존의 왼쪽/오른쪽 바깥 (포수 시점)
    c.oy = c.y<0 ? -1 : c.y>=9 ? 1 : 0;           // 존의 위/아래 바깥
    c.depth = Math.max(c.ox<0 ? -c.x-1 : c.ox>0 ? c.x-9 : 0, c.oy<0 ? -c.y-1 : c.oy>0 ? c.y-9 : 0);   // 0 살짝, 1 보통, 2 크게 빠짐
    c.lat = c.ox===0 ? (c.x/3|0) : c.oy===0 ? (c.y/3|0) : -1;
  }
});
function pointToCell(x,y){
  const gx = Math.max(-3, Math.min(11, Math.floor(x))), gy = Math.max(-3, Math.min(11, Math.floor(y)));
  return LAT[(gy+3)*GRID+(gx+3)];
}
// 굵은 구역 번호: 0~8 스트라이크, 9 위, 10 아래, 11 좌, 12 우, 13 좌상, 14 우상, 15 좌하, 16 우하 (포수 시점)
function coarseOf(i){
  if (i<NS){ const r=i/9|0, c=i%9; return (r/3|0)*3+(c/3|0); }
  const c=CELLS[i];
  if (c.ox===0) return c.oy<0 ? 9 : 10;
  if (c.oy===0) return c.ox<0 ? 11 : 12;
  return c.oy<0 ? (c.ox<0?13:14) : (c.ox<0?15:16);
}
// 13칸 값 배열에서 대각선 구역은 맞닿은 두 띠의 평균
function coarseVal(a, z){
  if (z<13) return a[z];
  const v = (z===13||z===14) ? 9 : 10, h = (z===13||z===15) ? 11 : 12;
  return (a[v]+a[h])/2;
}
function cellName(i, hand){
  const inL = hand!=='L';
  const io = left => (left===inL) ? '몸쪽' : '바깥';
  if (i<NS){
    const base = zoneName(coarseOf(i), hand);
    const sr=(i/9|0)%3, sc=(i%9)%3, parts=[];
    if (sr===0) parts.push('위'); else if (sr===2) parts.push('아래');
    if (sc!==1) parts.push(io(sc===0));
    return parts.length ? `${base} (${parts.join('·')})` : base;
  }
  const c = CELLS[i], depth = ['살짝 빠짐','빠짐','크게 빠짐'][c.depth];
  if (c.ox===0) return `${c.oy<0?'높은':'낮은'} 볼 (${c.lat===1?'가운데':io(c.lat===0)}·${depth})`;
  if (c.oy===0) return `${io(c.ox<0)}쪽 볼 (${['높게','가운데','낮게'][c.lat]}·${depth})`.replace('바깥쪽쪽','바깥쪽').replace('몸쪽쪽','몸쪽');
  return `${c.oy<0?'높은':'낮은'} ${io(c.ox<0)==='몸쪽'?'몸쪽':'바깥쪽'} 볼 (대각선·${depth})`;
}
// 3×3 굵은 구역 값을 칸 중심 좌표로 부드럽게 보간
function interp3(v, x, y){
  const u=Math.max(0,Math.min(2,(x-1.5)/3)), w=Math.max(0,Math.min(2,(y-1.5)/3));
  const i0=Math.min(1,Math.floor(u)), j0=Math.min(1,Math.floor(w)), fu=u-i0, fw=w-j0;
  const g=(r,c)=>v[r*3+c];
  return (1-fw)*((1-fu)*g(j0,i0)+fu*g(j0,i0+1)) + fw*((1-fu)*g(j0+1,i0)+fu*g(j0+1,i0+1));
}
for (const k in PITCHES){
  const P = PITCHES[k];
  const fine = a => CELLS.map((c,i)=> i<NS ? interp3(a, c.cx, c.cy) : coarseVal(a, coarseOf(i)));
  P.affF = fine(P.aff); P.affFL = fine(P.affL);   // 우타자용 / 좌타자용
}

const DIFFS = {
  easy:  {label:'쉬움',  budget:62, bat:1.0, hide:false},
  normal:{label:'보통',  budget:52, bat:1.00, hide:false},
  hard:  {label:'어려움',budget:42, bat:1.0, hide:true},
};
const MAX_LV = 8;
const LEGEND_LV = 10;   // 올스타 투수는 커스텀 한도(8)를 넘어 10까지 가요
// 밸런스 조정값 (KBO 리그 평균에 맞춤)
const TUNE = {
  chaseDepth:[0.65,0.38,0.14],  // 존에서 빠진 정도(살짝/보통/크게)별 유인구 스윙 배율
  chase2S:1.15,                // 2스트라이크일 때 유인구 스윙 배율
  chaseAff:0.25,               // 구종 효과가 유인구 스윙에 주는 영향
  chaseSpeed:1.1,              // 구속차 큰 변화구를 볼로 던질 때 유인구 스윙 배율
  dv20:0.90, dv12:0.94,        // 구속차 20/12km/h 이상일 때 컨택 배율
  heightChange:0.96, inOut:0.98,
  stuffC:0.026, stuffH:0.025,  // 구위 1레벨당 컨택·안타 감소
  hitMul:1.20, hitComp:0.7,                 // 존 안 인플레이 안타 확률 전체 배율
  twoStrikeC:1.08,             // 2스트라이크에서 짧게 잡고 맞히는 대응(컨택 배율)
  hrBase:0.10,                 // 안타 중 홈런 기본 비율(파워 1.0, 좋은 코스 기준)
  edgeSwing:1.0,               // 존 경계 칸 스윙 배율
  firstSwing:1.0,              // 초구 스윙 배율
};
const PEN_RATIO = 0.55, CLOSER_RATIO = 0.7;   // 불펜 투수는 선발 코스트의 55%, 마무리는 70%

// ----- 체력과 피로 -----
// 체력은 '부하'로 깎여요. 공 하나가 기본 1이고, 안타·장타·볼넷·긴 승부·주자 있을 때는 더 깎여요.
// 선발: 9이닝 경기 기준 부하 70+14L까지 버티고, 짧은 경기일수록 한도가 줄어요(그만큼 빨리 내려와요).
// 불펜·마무리: 경기 길이와 상관없이 34+7(L−1) (Lv.1이면 25구 안팎). 한도의 60%를 넘기면 피로가 쌓여요.
const LEN_FACTOR = {1:0.3, 3:0.45, 6:0.72, 9:1, 0:1};
// 불펜·마무리도 짧은 경기일수록 한도가 줄어요(선발보다는 덜): 9이닝 100%, 6이닝 86%, 3이닝 72%, 1이닝 60%
const RP_LEN_FACTOR = {1:0.6, 3:0.72, 6:0.86, 9:1, 0:1};
function staminaCap(L, starter=true, inn=9){
  if (!starter) return Math.round((34 + 7*(L-1)) * (RP_LEN_FACTOR[inn] ?? 1));
  return Math.round((70 + 14*L) * (LEN_FACTOR[inn] ?? 1));
}
const fatigueOf = (load, cap) => Math.max(0, (load/cap - 0.6)/0.4);
const staminaLeft = (load, cap) => Math.max(0, 1 - load/cap);
function effLevel(lv, f){
  return { stuff: Math.max(0, lv.stuff - 1.5*f), ctrl: Math.max(-3, Math.round((lv.ctrl - 1.5*f)*4)/4) };
}

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const rand=(a,b)=>a+Math.random()*(b-a);
const upCost = L => Math.ceil(L/2);                 // L → L+1
const statCost = L => { let s=0; for(let l=1;l<L;l++) s+=upCost(l); return s; };
// 제구: 노린 지점 주변으로 정규분포만큼 흩어져요. 레벨이 오를수록 표준편차(칸 단위)가 줄어요.
// 8을 넘는 레벨(올스타 전용)은 한 칸에 0.06씩만 줄어요: Lv.9 0.44칸, Lv.10 0.38칸
const sigmaOf = L => L<=MAX_LV ? 1.9 - 0.2*(L-1) : Math.max(0.3, 0.5 - 0.06*(L-MAX_LV));
function erf(x){ const s=Math.sign(x); x=Math.abs(x); const t=1/(1+0.3275911*x);
  return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x)); }
const Phi = x => 0.5*(1+erf(x/Math.SQRT2));
const nearRate = L => { const p = 2*Phi(1.5/sigmaOf(L))-1; return p*p; };   // 노린 칸 ±1칸 안
const ctrlRate = nearRate;
function aimPoint(target, L){        // 제구가 나쁠수록 한가운데 쪽으로 몰리는 경향
  const c=CELLS[target], pull=0.05*sigmaOf(L);
  return [c.cx+(4.5-c.cx)*pull, c.cy+(4.5-c.cy)*pull];
}
const veloOf = (k,stuff) => PITCHES[k].v0 + PITCHES[k].dv*(stuff-1);

function buildCost(build){
  let s=0;
  for (const k in build){ const p=build[k]; s += PITCHES[k].cost + statCost(p.stuff) + statCost(p.ctrl); }
  return s;
}

// ----- 타자 생성 -----
const SUR = ['김','이','박','최','정','강','조','윤','장','임','한','오','서','신','권','황','안','송','류','홍'];
const GIV = ['민','준','서','현','우','진','호','성','재','태','영','도','윤','지','건','하','석','찬','규','빈'];
function genName(){ return SUR[Math.random()*SUR.length|0] + GIV[Math.random()*GIV.length|0] + GIV[Math.random()*GIV.length|0]; }

// prof: 실제 선수·직접 설정한 타자 {name, hand, type, con, eye, pow, avg, spd, ...}. 없는 값은 유형 범위에서 뽑아요.
function genBatter(i, diffKey, handIn, prof){
  const d = DIFFS[diffKey];
  // 타자 유형을 먼저 정하고 능력치를 그 안에서 뽑아요. 체형은 이 능력치로 그려져요.
  const roll = Math.random();
  const type = (prof && prof.type) || (roll<0.33 ? 'power' : roll<0.66 ? 'contact' : 'balanced');
  const T = {
    power:   {pow:[1.15,1.50], con:[0.84,0.95], eye:[0.75,1.10], avg:[0.88,1.02], sw:1.06},
    contact: {pow:[0.50,0.80], con:[1.00,1.10], eye:[0.95,1.30], avg:[1.00,1.12], sw:0.97},
    balanced:{pow:[0.80,1.15], con:[0.92,1.02], eye:[0.85,1.20], avg:[0.94,1.06], sw:1.00},
  }[type];
  const pv = (k, r) => (prof && prof[k]!=null) ? prof[k] : rand(...r);
  const eye = pv('eye',T.eye), con = pv('con',T.con), pow = pv('pow',T.pow), avg = pv('avg',T.avg);
  const ht = rand(0.93,1.05) + (type==='power'?0.03:type==='contact'?-0.02:0);
  const spd = pv('spd', {power:[0.1,0.45], contact:[0.55,1.0], balanced:[0.3,0.7]}[type]);   // 주력 0~1
  const hand = (prof && prof.hand) || handIn || (Math.random()<0.62 ? 'R' : 'L');
  const rowBias = rand(-0.14,0.14);
  const colBias = (hand==='R'?1:-1) * rand(-0.04,0.14);   // 대체로 몸쪽(당겨치기)에 강함
  const zs = [0,1,2,3,4,5,6,7,8].sort(()=>Math.random()-0.5);
  const hot = zs.slice(0,2), cold = zs.slice(2,4);
  const cs=[], cc=[], ch=[];
  for (let z=0; z<13; z++){
    let s,c,h;
    if (z<9){
      const [r,cc] = ZPOS[z]; const edge = (r!==1)+(cc!==1);
      s=[0.82,0.74,0.64][edge]; c=[0.95,0.91,0.86][edge]; h=[0.47,0.39,0.31][edge];
      const isHot=hot.includes(z), isCold=cold.includes(z);
      h *= avg*(1+rowBias*(1-r))*(1+colBias*(1-cc))*rand(0.92,1.08)*(isHot?1.25:isCold?0.72:1);
      s *= (isHot?1.08:isCold?0.95:1) / Math.pow(eye,0.3) * T.sw;
      c *= con*(isHot?1.04:isCold?0.94:1);
    } else {
      s = 0.26/eye*rand(0.8,1.2)*T.sw; c = 0.64*con*rand(0.9,1.1);
      h = 0.17*avg*rand(0.8,1.2)*(z===9?1+rowBias:z===10?1-rowBias:1);
    }
    cs.push(s); cc.push(c*d.bat); ch.push(h*d.bat);
  }
  // 225칸으로 세분화: 스트라이크존은 보간, 존 경계 칸은 치기 어려워요.
  const swing=[], contact=[], hit=[], meanCh = ch.slice(0,9).reduce((x,y)=>x+y)/9;
  CELLS.forEach((cl,i)=>{
    let s,c,h;
    if (i<NS){
      const edge = Math.min(cl.cx, 9-cl.cx, cl.cy, 9-cl.cy) < 1;
      s = interp3(cs, cl.cx, cl.cy)*(edge?TUNE.edgeSwing:1)*rand(0.96,1.04);
      c = interp3(cc, cl.cx, cl.cy)*(edge?0.97:1);
      h = interp3(ch, cl.cx, cl.cy)*(edge?0.9:1)*rand(0.93,1.07)*TUNE.hitMul;
    } else {
      // 볼 칸: 존에서 멀어질수록(깊이) 덜 속고 잘 못 쳐요. 대각선은 더 안 속아요.
      const z=coarseOf(i), corner = z>=13, dp = cl.depth;
      s = coarseVal(cs,z)*TUNE.chaseDepth[dp]*(corner?0.8:1)*rand(0.9,1.1);
      c = coarseVal(cc,z)*[1.1,0.97,0.8][dp]*rand(0.95,1.05);
      h = coarseVal(ch,z)*[1.2,0.95,0.65][dp]*(corner?0.9:1)*rand(0.9,1.1);
      if (dp===0){   // 존에 바로 붙은 볼은 옆 스트라이크 칸의 강약을 조금 따라가요
        const rel = interp3(ch, clamp(cl.cx,0.5,8.5), clamp(cl.cy,0.5,8.5)) / meanCh;
        h *= Math.pow(clamp(rel,0.7,1.3), 0.6);
      }
    }
    swing.push(clamp(s,0.04,0.95)); contact.push(clamp(c,0.30,0.97)); hit.push(h);
  });
  // 핫존이 비현실적으로 뜨겁지 않게 타자 평균 쪽으로 눌러 줘요(실제 KBO 핫존 타율은 4할 안팎)
  const mS = hit.slice(0,81).reduce((a,x)=>a+x,0)/81;
  for (let i=0;i<hit.length;i++) hit[i] = clamp(mS + (hit[i]-mS)*TUNE.hitComp, 0.04, 0.50);
  // 접근법: 게스 히터(노림수를 갖고 기다림) / 공 보고 공 치기(반응형). 파워형은 게스 히터가 많아요.
  const app = (prof && prof.app) || (Math.random() < (type==='power'?0.65:type==='contact'?0.35:0.5) ? 'guess' : 'react');
  const b = {name:(prof&&prof.name)||genName(), order:i+1, hand, type, app, ht, spd, eye, con, pow, avg, swing, contact, hit, hot, cold};
  if (prof && prof.info) b.info = prof.info;     // 실제 기록 표시용
  return b;
}
const grade = (x,lo,hi)=>{ const t=(x-lo)/(hi-lo); return t>0.75?'A':t>0.5?'B':t>0.25?'C':'D'; };

// ----- 제구 산포: 노린 칸 → 실제 칸 분포 (0.25칸 격자로 적분, 캐시) -----
const STEP=0.25, LO=-9, HI=18, NB=Math.round((HI-LO)/STEP);
const _scCache = new Map();
function scatter(target, L){
  const key = target+':'+L; if (_scCache.has(key)) return _scCache.get(key);
  const [mx,my]=aimPoint(target,L), sg=sigmaOf(L);
  const wx=new Float64Array(NB), wy=new Float64Array(NB);
  for (let i=0;i<NB;i++){ const a=LO+i*STEP, b=a+STEP;
    wx[i]=Phi((b-mx)/sg)-Phi((a-mx)/sg); wy[i]=Phi((b-my)/sg)-Phi((a-my)/sg); }
  const out=new Array(NCELL).fill(0); let tot=0;
  for (let i=0;i<NB;i++){ if (wx[i]<1e-7) continue; const x=LO+(i+0.5)*STEP;
    for (let j=0;j<NB;j++){ const w=wx[i]*wy[j]; if (w<1e-9) continue; out[pointToCell(x, LO+(j+0.5)*STEP)]+=w; tot+=w; } }
  for (let i=0;i<NCELL;i++) out[i]/=tot;
  _scCache.set(key,out); return out;
}
function gauss(){ let u=0; while(!u) u=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random()); }
// 노린 칸 ±1칸 안에 들어갈 확률
function onTargetRate(target, sc){
  const t=CELLS[target]; let p=0;
  for (let i=0;i<NCELL;i++){ const c=CELLS[i]; if (Math.abs(c.cx-t.cx)<=1.01 && Math.abs(c.cy-t.cy)<=1.01) p+=sc[i]; }
  return p;
}

// ----- 실제 구역에서의 결과 확률 -----
// ctx: {count:{b,s}, prev:{key,velo,zone}|null, streak, seen:{key:n}, ph:'R'|'L' 투수 손, tto: 이 투수와 앞서 끝낸 타석 수}
// 우투수 기준 구종 효과. 공이 휘는 방향은 같아도 타자가 어느 타석에 서느냐에 따라 몸쪽/바깥쪽이 바뀌어서,
// 우타자용(aff)과 좌타자용(affL) 지도를 따로 둬요.
// 좌완은 공이 우완과 반대로 휘어요: 우완 지도를 좌우로 뒤집고, 상대 타자 손도 바꿔서 써요.
// (좌완 vs 좌타 = 우완 vs 우타의 거울상, 좌완 vs 우타 = 우완 vs 좌타의 거울상)
const MIRROR = CELLS.map(c => LAT[(c.y+3)*GRID + (8-c.x+3)]);
const MIRROR13 = [2,1,0,5,4,3,8,7,6,9,10,12,11];
function affOf(k, z, hand, ph='R'){
  if (ph==='L'){ z = MIRROR[z]; hand = hand==='L' ? 'R' : 'L'; }
  return hand==='L' ? PITCHES[k].affFL[z] : PITCHES[k].affF[z];
}
function affCoarse(k, hand, ph='R'){
  if (ph==='L'){ const A = hand==='L' ? PITCHES[k].aff : PITCHES[k].affL; return MIRROR13.map(i=>A[i]); }
  return hand==='L' ? PITCHES[k].affL : PITCHES[k].aff;
}
// 몸에 맞는 공: 타자 몸쪽으로 크게 빠질수록 잘 맞아요 (대각선 포함)
function hbpOf(z, hand){
  const c = CELLS[z]; if (z<NS) return 0;
  const inside = hand==='L' ? c.ox===1 : c.ox===-1;
  return inside ? [0.01,0.08,0.25][c.depth] : 0;
}
// ----- 타자 접근법 -----
// 게스 히터는 공마다 직구 계열(포심·투심·커터)과 변화구 중 하나를 노려요.
// 타자 카운트(볼이 많을 때)는 직구, 2스트라이크는 변화구 쪽. 방금 본 계열은 이번엔 바뀐다고 보지만,
// 같은 계열이 두 번 연속 오면 또 온다고 봐요. → 무조건 구종을 바꾸는 게 정답이 아니에요.
const isFastK = k => !!PITCHES[k].fast;
function guessFastProb(count, ab){
  const {b, s} = count; let p = 0.55;
  if (b===3 || b-s>=2) p = 0.85; else if (b>s) p = 0.7; else if (s===2) p = 0.45;
  const n = ab.length;
  if (n){ const lf = isFastK(ab[n-1].key);
    if (n>=2 && isFastK(ab[n-2].key)===lf) p += lf ? 0.2 : -0.2;
    else p += lf ? -0.2 : 0.2; }
  return clamp(p, 0.1, 0.9);
}
// ----- 존 타율(표시용) -----
// 그 칸으로 들어온 공에서 타석이 끝났을 때의 타율(안타 ÷ 타수)이에요. 중계·분석에서 보는 '존별 타율'과 같은 개념.
// 평범한 직구(구위 3)·1볼 1스트라이크 기준으로 계산하고, 시뮬레이션 실측에 맞춰 보정해요.
const ZA_CAL = 1.18, ZA_CAL_BALL = 0.72, ZA_K = 0.4;   // 시뮬레이션 실측(스트라이크존/볼존)에 맞춘 보정값
function zoneAvgOf(bat, i){
  if (!bat._za) bat._za = [];
  if (bat._za[i]==null){
    const o = zoneOutcome(bat, 'FF', 3, i, {count:{b:1,s:1}, prev:null, streak:0, seen:0, tto:0, ph:'R'}, 0);
    const k = (o.whiff + o.called)*ZA_K, d = o.hit + o.out + k;
    bat._za[i] = d>0 ? Math.min(0.6, (i<81 ? ZA_CAL : ZA_CAL_BALL)*o.hit/d) : 0;
  }
  return bat._za[i];
}
// 실투 정도: 노린 칸 중심에서 1칸 넘게 빗나가면 커지기 시작해 3.5칸에서 최대(1)
const missFactor = d => Math.max(0, Math.min(1, (d-1)/2.5));
function zoneOutcome(bat, k, stuff, z, ctx, m=0){
  const P = PITCHES[k], affRaw = affOf(k, z, bat.hand, ctx.ph), strike = z<NS, velo = veloOf(k,stuff) + ((ctx.vAdj&&ctx.vAdj[k])||0);
  // 실투는 변화와 위력이 덜 먹혀요(좋은 효과만 줄고, 나쁜 코스는 그대로 나빠요)
  const aff = affRaw>0 ? affRaw*(1-0.5*m) : affRaw;
  // 플래툰: 투수와 같은 손 타자는 공이 몸에서 멀어지며 휘어 불리하고, 반대 손 타자는 공이 잘 보여 유리해요
  const same = (ctx.ph||'R') === (bat.hand||'R');
  const pm = ctx.plat || 1;   // 사이드암·언더핸드는 좌우 상성이 더 커요
  const platC = same ? 1-0.02*pm : 1+0.02*pm, platH = same ? 1-0.04*pm : 1+0.05*pm;
  const {b:B, s:S} = ctx.count;
  let sw = bat.swing[z];
  if (B===3 && S===0) sw *= 0.25;
  else if (B===0 && S===0) sw *= TUNE.firstSwing;
  if (S===2) sw = strike ? 1-(1-sw)*0.45 : Math.min(0.9, sw*TUNE.chase2S);
  else if ((B===2&&S===0)||(B===3&&S===1)) sw *= strike?1.05:0.8;
  if (!strike) sw *= 1 + TUNE.chaseAff*aff;
  else sw *= 1 + 0.08*m;
  // 접근법: 게스 히터는 노림수가 맞으면 강하고 틀리면 약해요. 공 보고 공 치는 타자는 유인구에 잘 속아요.
  const app = bat.app || 'react';
  let gm = null;
  if (app==='guess' && ctx.guessFast!=null) gm = ctx.guessHit!=null ? ctx.guessHit : (isFastK(k) ? ctx.guessFast : 1-ctx.guessFast);
  if (gm!=null) sw *= strike ? 0.9+0.15*gm : 0.85+0.3*gm;
  else if (app==='react' && !strike) sw *= 1.18;

  let seqC=1, seqH=1, seqS=1; const notes=[];
  const prev = ctx.prev;
  if (prev){
    const dv = Math.abs(velo - prev.velo);
    if (dv>=20){ seqC*=TUNE.dv20; notes.push({t:`구속차 ${dv.toFixed(0)}km/h`, good:true}); }
    else if (dv>=12){ seqC*=TUNE.dv12; notes.push({t:`구속차 ${dv.toFixed(0)}km/h`, good:true}); }
    if (dv>=12 && !strike) seqS*=TUNE.chaseSpeed;
    if (dv>=12 && app==='react'){ seqC*=0.97; notes.push({t:'공 보고 치는 타자 · 구속 변화에 약함', good:true}); }
    const pc=CELLS[prev.zone], cc=CELLS[z];
    if (Math.abs(pc.cy-cc.cy)>=5){ seqC*=TUNE.heightChange; notes.push({t:'높낮이 변화', good:true}); }
    if (Math.abs(pc.cx-cc.cx)>=5){ seqC*=TUNE.inOut; notes.push({t:'몸쪽·바깥쪽 교차', good:true}); }
    if (prev.key===k){
      const sk = app==='guess' ? 0.5 : 1;   // 게스 히터는 같은 공 반복에 덜 적응해요(노림수가 엇갈려서)
      seqC *= 1+0.04*sk*ctx.streak; seqH *= 1+0.035*sk*ctx.streak;
      notes.push({t:`같은 구종 ${ctx.streak+1}연속`, good:false});
      if (Math.hypot(pc.cx-cc.cx, pc.cy-cc.cy)<1.6){ seqC*=1.06; seqH*=1.08; notes.push({t:'같은 코스 반복', good:false}); }
    }
  }
  // 같은 투수를 두 번째, 세 번째 상대하면 타자가 공에 익숙해져요
  const tto = Math.min(ctx.tto||0, 3);
  if (tto>0){ seqC *= 1+0.03*tto; seqH *= 1+0.04*tto; if (!strike) seqS *= 1-0.05*tto;
    notes.push({t:`이 투수 상대 ${tto+1}번째 타석 (타자 적응)`, good:false}); }
  const seen = ctx.seen[k]||0;
  if (seen>=2){ seqC *= 1+(app==='guess'?0.01:0.02)*seen; notes.push({t:`이번 타석 ${seen}번째 본 구종`, good:false}); }

  if (m>=0.35) notes.push({t:`실투 (노린 곳에서 크게 빗나감)`, good:false});
  let gC = 1, gH = 1;
  if (gm!=null){ gC = 0.88+0.24*gm; gH = 0.85+0.33*gm;
    if (ctx.guessHit!=null){ const gf = isFastK(k) === !!ctx.guessHit;
      notes.push({t: ctx.guessHit ? `노림수 적중 (${gf?'직구':'변화구'} 노림)` : `노림수 빗나감 (${gf?'직구':'변화구'} 노림)`, good: !ctx.guessHit}); }
    else notes.push({t:`게스 히터 · 이 공 계열을 노릴 확률 ${Math.round(gm*100)}%`, good: gm<0.5});
  } else if (app==='react' && strike) gC = 1.02;
  sw = clamp(sw*seqS, 0.02, 0.97);
  const ct = clamp(bat.contact[z]*platC*gC*(1-TUNE.stuffC*(stuff-1))*(1-0.10*aff)*seqC*(1+0.08*m)*(S===2?TUNE.twoStrikeC:1), 0.25, 0.97);
  const foulP = clamp(0.40 + 0.01*(stuff-1) + (S===2?0.05:0), 0, 0.6);
  const h = clamp(bat.hit[z]*platH*gH*(1-TUNE.stuffH*(stuff-1))*(1-0.15*aff)*seqH*(1+0.25*m), 0.03, 0.7);
  const take = 1-sw;
  const hb = strike ? 0 : take*hbpOf(z, bat.hand);
  return {
    ball: strike?0:take-hb, hbp: hb, called: strike?take:0,
    whiff: sw*(1-ct), foul: sw*ct*foulP,
    out: sw*ct*(1-foulP)*(1-h), hit: sw*ct*(1-foulP)*h,
    notes
  };
}
const OUTKEYS = ['ball','hbp','called','whiff','foul','out','hit'];

// 모든 칸을 노렸을 때의 기대 결과를 한꺼번에 (칸별 결과를 한 번만 계산해 재사용)
function expectedAll(bat, k, lv, ctx){
  const O = CELLS.map((_,z)=>[0,1,2,3,4].map(q=>zoneOutcome(bat,k,lv.stuff,z,ctx,q/4)));   // 실투 정도 5단계
  return CELLS.map((_,t)=>{
    const sc = scatter(t, lv.ctrl), res={ball:0,hbp:0,called:0,whiff:0,foul:0,out:0,hit:0}, tc=CELLS[t];
    for (let z=0; z<NCELL; z++){ const w=sc[z]; if (w<1e-5) continue;
      const c=CELLS[z], o=O[z][Math.round(missFactor(Math.hypot(c.cx-tc.cx, c.cy-tc.cy))*4)];
      res.ball+=w*o.ball; res.hbp+=w*o.hbp; res.called+=w*o.called; res.whiff+=w*o.whiff; res.foul+=w*o.foul; res.out+=w*o.out; res.hit+=w*o.hit; }
    res.notes = O[t][0].notes; res.onTarget = onTargetRate(t, sc);
    return res;
  });
}
// 노린 구역 기준 기대 결과 (제구 산포 포함)
function expectedOutcome(bat, k, lv, target, ctx){
  const sc = scatter(target, lv.ctrl);
  const res = {ball:0,hbp:0,called:0,whiff:0,foul:0,out:0,hit:0, notes:[]};
  let notesFrom = null;
  const tc = CELLS[target];
  sc.forEach((w,z)=>{ if(w<1e-5) return;
    const c = CELLS[z], o = zoneOutcome(bat,k,lv.stuff,z,ctx, missFactor(Math.hypot(c.cx-tc.cx, c.cy-tc.cy)));
    OUTKEYS.forEach(x=>res[x]+=w*o[x]);
    if (z===target) notesFrom = o.notes;
  });
  res.notes = notesFrom || zoneOutcome(bat,k,lv.stuff,target,ctx).notes;
  res.onTarget = onTargetRate(target, sc);
  return res;
}

function pickW(weights){ let r=Math.random(), acc=0; for (let i=0;i<weights.length;i++){ acc+=weights[i]; if (r<acc) return i; } return weights.length-1; }

function hitType(bat, k, stuff, z, m=0){
  const c = CELLS[z];
  const loc = z>=NS ? 0.5 : Math.hypot(c.cx-4.5,c.cy-4.5)<2.2 ? 1.3 : c.cy<6 ? 1.1 : 0.85;
  let hr = TUNE.hrBase*bat.pow*loc*(1-0.04*(stuff-1))*(PITCHES[k].gb?0.6:1)*(1+0.8*m);   // 실투는 장타가 잘 나와요
  const d2 = 0.19*Math.sqrt(bat.pow)*(PITCHES[k].gb?0.8:1)*(1+0.3*m), t3 = 0.02;
  const i = pickW([1-hr-d2-t3, d2, t3, hr]);
  return [1,2,3,4][i];
}

// 범타의 타구 종류: 땅볼(gb) / 뜬공(fb) / 직선타(ld)
// 낮은 공·가라앉는 공일수록 땅볼, 높은 공·파워형 타자일수록 뜬공이 많아요.
// 땅볼 유도 구종(투심·스플리터·체인지업 등)은 구위가 높을수록 땅볼이 더 늘어요.
const GB_PITCH = {SI:[.20,-.15], FS:[.12,-.09], CH:[.11,-.08], CU:[.06,-.04], SL:[.04,-.03], FC:[.03,-.02], FF:[-.06,.06]};
function battedType(bat, k, z, gbAdj=0, stuff=4){
  const c = CELLS[z]; let gb=0.47+gbAdj, fb=0.40-gbAdj, ld=0.11;
  if (c.cy>6){ gb+=0.15; fb-=0.12; } else if (c.cy<3){ gb-=0.15; fb+=0.15; }
  if (c.cy>9){ gb+=0.08; fb-=0.05; }
  const a = GB_PITCH[k] || [0,0], sc = a[0]>0 ? 0.6+0.1*stuff : 1;
  gb+=a[0]*sc; fb+=a[1]*sc;
  const ty = bat.type || 'balanced';
  if (ty==='power'){ fb+=0.08; gb-=0.06; } else if (ty==='contact'){ ld+=0.03; gb+=0.03; fb-=0.06; }
  gb=Math.max(.08,gb); fb=Math.max(.08,fb); ld=Math.max(.05,ld);
  const t=gb+fb+ld; return ['gb','fb','ld'][pickW([gb/t,fb/t,ld/t])];
}
// ----- 타구 방향과 수비수 -----
const POS_KO = {1:'투수',2:'포수',3:'1루수',4:'2루수',5:'3루수',6:'유격수',7:'좌익수',8:'중견수',9:'우익수'};
const DP_CHAIN = {6:'6-4-3', 4:'4-6-3', 5:'5-4-3', 3:'3-6-3', 1:'1-6-3'};
// 'L' 3루·좌익수 쪽, 'C' 가운데, 'R' 1루·우익수 쪽. 우타자는 당기면 왼쪽, 좌타자는 오른쪽
function spraySide(bat){
  const pullP = bat.type==='power' ? 0.48 : bat.type==='contact' ? 0.34 : 0.41, r = Math.random();
  const dir = r<pullP ? 'pull' : r<pullP+0.34 ? 'center' : 'oppo';
  if (dir==='center') return 'C';
  return (dir==='pull') === (bat.hand!=='L') ? 'L' : 'R';
}
const pickN = arr => { const t = arr.reduce((a,x)=>a+x[1],0); return arr[pickW(arr.map(x=>x[1]/t))][0]; };
function fielderOf(bat, bb){
  const side = spraySide(bat);
  if (bb==='gb') return pickN(side==='L'?[[5,.42],[6,.58]] : side==='C'?[[6,.38],[4,.38],[1,.24]] : [[4,.55],[3,.45]]);
  if (bb==='fb'){
    if (Math.random()<0.05) return 2;
    if (Math.random()<0.18) return pickN(side==='L'?[[5,1],[6,1]] : side==='C'?[[6,1],[4,1]] : [[3,1],[4,1]]);
    return side==='L' ? 7 : side==='C' ? 8 : 9;
  }
  return pickN(side==='L'?[[5,.3],[6,.3],[7,.4]] : side==='C'?[[1,.1],[6,.25],[4,.25],[8,.4]] : [[3,.3],[4,.3],[9,.4]]);
}
function hitDesc(bat, bases){
  const side = spraySide(bat), coin = Math.random()<0.5;
  if (bases===4) return `${{L:'좌측',C:'가운데',R:'우측'}[side]} 담장 홈런`;
  if (bases===3) return `${{L:'좌중간',C:'우중간',R:'우익선상'}[side]} 3루타`;
  if (bases===2) return `${side==='C' ? (coin?'좌중간':'우중간') : side==='L' ? (coin?'좌익선상':'좌중간') : (coin?'우익선상':'우중간')} 2루타`;
  if ((bat.spd||0)>=0.7 && Math.random()<0.15) return '내야 안타';
  return `${{L:'좌전',C:'중전',R:'우전'}[side]} 안타`;
}
// 병살 확률(1루 주자, 2아웃 전 땅볼일 때). 타자 발이 빠를수록, 1루수 쪽 타구일수록 덜 잡혀요.
function dpChance(bat, pos){ const sp = bat.spd!=null ? bat.spd : 0.5; return 0.56*(1.25 - 0.5*sp)*(pos===3?0.8:1); }

// ----- 도루와 견제 -----
// from: 0 = 1루 주자가 2루로, 1 = 2루 주자가 3루로. hold: 이 주자에게 견제한 횟수(리드가 짧아져요)
function stealAttemptProb(runner, from, outs, ph){
  let p = 0.02 + 0.10*runner.spd*runner.spd;
  if (from===1) p *= 0.35;                        // 3루 도루는 드물어요
  if (ph==='L' && from===0) p *= 0.7;             // 좌완은 1루 주자를 보고 던져서 뛰기 어려워요
  if (outs===2) p *= 1.15;
  return p * Math.max(0.2, 1 - 0.25*(runner.hold||0));
}
function stealSuccessProb(runner, from, velo, ph){
  let s = 0.72 + 0.3*(runner.spd-0.5) + (140-velo)*0.004;   // 느린 공일수록 뛰기 쉬워요
  if (from===1) s -= 0.05;
  if (ph==='L' && from===0) s -= 0.06;
  s -= 0.04*(runner.hold||0);
  return clamp(s, 0.25, 0.95);
}
function pickoffProb(runner, base, ph){
  let p = 0.015 + 0.035*runner.spd;               // 빠른 주자일수록 리드가 커서 잡힐 수도 있어요
  if (ph==='L' && base===0) p *= 1.6;
  if (base===1) p *= 0.6;
  return p;
}

// ----- 멘탈과 위기 상황 -----
// 위기 단계: 득점권 주자 +1(만루면 +2), 3볼 +0.5, 도전 모드에서 2실점 상태 +1
function crisisOf(s){
  let lv = 0; const why = [];
  const b = s.bases || [0,0,0];
  if (b[0] && b[1] && b[2]){ lv += 2; why.push('만루'); }
  else if (b[1] || b[2]){ lv += 1; why.push('득점권 주자'); }
  if (s.count && s.count.b===3){ lv += 0.5; why.push('3볼'); }
  if (s.chRuns===2){ lv += 1; why.push('도전 모드 2실점'); }
  return {lv, why};
}
// 위기 1단계당 제구 레벨 하락: 멘탈 1이면 0.95, 멘탈 8이면 0.25 (멘탈이 높아도 조금은 흔들려요)
const mentalDrop = (lv, mental) => { const m = clamp(mental||1, 1, LEGEND_LV); return lv * (m<=MAX_LV ? 1.05 - 0.1*m : 0.25 - 0.05*(m-MAX_LV)); };

// ----- 실제 기록 → 능력치 -----
// 타자: 타율·삼진율·볼넷률·순장타율(ISO)·도루로 능력치를 정해요. (리그 평균 정도면 1.0 근처)
// 리그 평균(타율, 순장타율): 시즌마다 타고투저 정도가 달라서 리그 대비로 환산해요
const LEAGUE = {1992:[.262,.120], 1994:[.256,.115], 1999:[.276,.150], 2003:[.267,.147], 2008:[.267,.115], 2010:[.270,.135],
                2014:[.289,.154], 2015:[.280,.157], 2016:[.290,.153], 2017:[.286,.155], 2019:[.267,.118], 2020:[.273,.136],
                2021:[.260,.121], 2022:[.259,.116], 2023:[.263,.111], 2024:[.277,.143],

// 해외 리그(국가대표 해외파) 리그 평균 — 근사값(MLB는 리그 전체, NPB는 소속 리그 기준 추정)
const LEAGUE_X = {'2008 MLB':[.264,.152], '2010 MLB':[.257,.146], '2008 NPB':[.265,.127], '2010 NPB':[.270,.133], '2015 NPB':[.253,.117]};
function hitterProf(d){
  const K = d.so/d.pa, BB = d.bb/d.pa, ISO = d.slg - d.avg;
  const lgx = /MLB|NPB/.exec(d.season), yr = parseInt(d.season);
  const [lgA, lgI] = (lgx && LEAGUE_X[`${yr} ${lgx[0]}`]) || LEAGUE[yr] || [.27,.14];
  // 삼진을 뺀 타구 중 안타 비율로 존 타율을 정해요(삼진 덜 당하는 건 컨택에서 따로 반영)
  const ab = d.pa*0.96 - d.bb, hitRate = d.avg*ab/Math.max(1, ab-d.so), lgRate = lgA/0.795;
  // 실제 기록엔 우투수를 더 많이 상대한 좌우 상성이 이미 들어 있어서, 좌타는 조금 빼고 우타는 조금 더해요
  const avg = clamp((1 + (hitRate/lgRate - 1)*1.2) / (d.hand==='L' ? 1.025 : 0.985), .75, 1.35);
  const con = clamp(1 - (K-.16)*1.6, .78, 1.14);
  const eye = clamp(.6 + BB*4.8, .7, 1.45);
  const pow = clamp(.35 + 0.62*ISO/lgI, .45, 1.65);
  const spd = clamp(.2 + d.sb/55, .12, 1);
  const type = (con>=1.12 && pow<1.6) ? 'contact' : pow>=1.25 ? 'power' : (con>=1.03 && pow<0.85) ? 'contact' : 'balanced';
  // 삼진이 잦은 장타자는 노림수형, 삼진이 적은 타자는 공 보고 공 치기로 봐요
  const app = (type==='power' || K>0.17) ? 'guess' : 'react';
  const f3 = x => x.toFixed(3).replace(/^0/,'');
  return {name:d.name, hand:d.hand, type, app, avg, con, eye, pow, spd,
    info:{season:d.season, line:`${f3(d.avg)} / ${f3(d.obp)} / ${f3(d.slg)}`, hr:d.hr, sb:d.sb, bb:d.bb, so:d.so, pa:d.pa, est:d.est||false}};
}

function silSvg(bat, label){
  const t = Math.max(0, Math.min(1, (bat.pow-0.5)/1.0)), h = bat.ht || 1, cx = 30;
  const hr = 8.5+2*t, sw = 7.5+8*t, hw = 5.5+5.5*t, st = 13+5*t, lw = 6.5+6*t;
  const hx = cx-sw-1, hy = 41;
  const L = 34+12*t, ang = (16+18*t)*Math.PI/180;
  const tx = hx - L*Math.sin(ang), ty = hy - L*Math.cos(ang);
  const f = n => n.toFixed(1);
  const body = `<circle cx="${cx}" cy="30" r="${f(hr)}"/>
    <path d="M${f(cx+hr-3)} ${f(30-hr*0.35)} l${f(9+t*2)} 2.5 l-1 3.5 l${f(-8-t*2)} -1 z"/>
    <path d="M${f(cx-sw)} 46 Q${cx} ${f(39-t*2)} ${f(cx+sw)} 46 L${f(cx+hw+1)} 94 Q${cx} ${f(98+t*3)} ${f(cx-hw-1)} 94 Z"/>
    <path d="M${f(cx+sw-2)} 51 Q${f(cx)} ${f(58+t*2)} ${f(hx)} ${hy}" fill="none" stroke="currentColor" stroke-width="${f(6+4*t)}" stroke-linecap="round"/>
    <path d="M${f(hx)} ${hy} L${f(tx)} ${f(ty)}" fill="none" stroke="currentColor" stroke-width="${f(4+2*t)}" stroke-linecap="round"/>
    <path d="M${f(cx-hw-1)} 92 L${f(cx-st-lw/2)} 186 L${f(cx-st+lw/2)} 188 L${cx} ${f(122+t*4)} L${f(cx+st-lw/2)} 188 L${f(cx+st+lw/2)} 186 L${f(cx+hw+1)} 92 Z"/>
    <path d="M${f(cx-st-lw/2-2)} 184 h${f(lw+7)} v6 h${f(-lw-9)}z"/><path d="M${f(cx+st-lw/2)} 184 h${f(lw+7)} v6 h${f(-lw-5)}z"/>`;
  const sized = `<g transform="translate(${cx} 192) scale(${f(h)}) translate(${-cx} -192)">${body}</g>`;
  const g = bat.hand!=='L' ? `<g transform="translate(${2*cx} 0) scale(-1 1)">${sized}</g>` : sized;
  return `<svg viewBox="-8 -24 76 218" fill="currentColor" aria-label="${label||''}">${g}</svg>`;
}

function zoneGrid(cls, cell, markers){
  let h = `<div class="zg ${cls}">`;
  for (let z=0; z<17; z++){
    const c = cell(z) || {};
    const act = c.act ? ` data-act="${c.act}" role="button" tabindex="0" aria-label="${zn(z)}"` : '';
    h += `<div class="zc ${z<9?'in':'out'} ${c.cls||''}" style="grid-area:a${z};${c.style||''}"${act}>${c.html||''}${markers?markers(z):''}</div>`;
  }
  return h + `<div class="zframe"></div></div>`;
}

function affMini(k, hand, ph){
  const P = PITCHES[k], A = affCoarse(k, hand, ph||'R');
  return zoneGrid('mini pv', z => {
    const a = coarseVal(A, z);
    const bg = a>=0 ? mix(WHITE, P.color, Math.min(1,a/0.8)) : mix(WHITE, '#c9d0d8', Math.min(1,-a/0.8)*0.6);

    return {role:'', name:str(r[0],12), hand:r[1]?'L':'R', slot:SLOT_KEYS()[r[2]]||'over', build, sta:lv(r[3]), mental:lv(r[4])}; });
  staff.forEach((p,i)=>p.role=roleOf(i, staff.length));

    return {name:str(r[0],10), hand:(HAND_OPT[r[1]]||HAND_OPT[0])[0], type:(TYPE_OPT[r[2]]||TYPE_OPT[0])[0], app:(APP_OPT[r[3]]||APP_OPT[0])[0], spd:(SPD_OPT[r[4]]||SPD_OPT[0])[0]}; });

}

function renderRules(){

    <article><h3>카운트와 코스트</h3><ul>

      <li>실책: 아웃이 될 땅볼의 3%, 뜬공의 1.2%, 직선타의 0.8%가 실책이 돼요. 내야 실책의 25%는 송구 실책이라 타자와 주자가 한 베이스 더 가요.</li>
      <li>고의사구: 공을 던지지 않고 타자를 1루로 보내요(체력 소모 없음).</li>
      <li>우리 팀은 홈(말 공격) 또는 원정(초 공격)을 고를 수 있어요. 공격 이닝마다 무작위로 점수를 내요(이닝당 평균 0.57점, 득점할 확률 29%). 득점권 위기를 맞은 뒤 무실점으로 이닝을 끝내면 분위기를 타서 바로 다음 공격의 득점 확률이 올라가요(득점권 위기 39%, 만루 49%, 만루+3볼 54%). 홈 팀이 마지막 이닝 초를 마쳤을 때 앞서 있으면 말 없이 끝나고, 말에 역전하면 끝내기예요. 동점이면 연장전(설정에서 11회까지 또는 승부 날 때까지를 골라요. 11회까지면 그래도 같을 때 무승부). 3이닝 경기는 6회까지 0:0으로 가정하고 7~9회를, 6이닝 경기는 3회까지 0:0으로 가정하고 4~9회를, 1이닝 경기는 9회만 던져요. 승·패·홀드·세이브·블론은 KBO 기록 규칙을 단순하게 적용해요(세이브: 3점 차 이내 1이닝 이상, 동점 주자가 대기 타석까지 있을 때 등판, 또는 점수 차와 상관없이 3이닝 이상)(선발승은 9이닝 경기 5이닝, 짧은 경기는 그 비율).</li>
      <li>체력 소모: 공 하나에 1씩 깎이고, 주자가 있으면 조금 더, 한 타자와 6구째부터는 공마다 +0.5, 안타 +2·2루타/3루타 +3·홈런 +4, 볼넷·사구 +1, 실점 1점당 +1, 잘 맞은 타구(직선타, 파워형의 뜬공) +0.5~1이 더 깎여요. 한도의 60%를 넘으면 피로가 쌓여 구속과 구위가 떨어지고 제구 범위가 넓어져요.</li>
      <li>도루: 1루·2루 주자는 앞 베이스가 비어 있으면 투구 때 뛸 수 있어요. 발 빠른 주자일수록 자주 뛰고, 느린 변화구일수록 성공률이 올라가요. 좌완은 1루 주자를 묶기 쉬워요. 파울이면 귀루, 공이 맞아 나가면 히트앤런(병살 없음, 안타 때 한 베이스 더)이에요.</li>
      <li>견제: 주자 옆 "견제" 버튼으로 견제구를 던져요. 가끔 견제사로 잡고, 실패해도 리드가 짧아져 도루 시도와 성공률이 줄어요. 한 타석에 3번까지는 악송구가 드물지만(2%), 4번째부터는 악송구 확률이 25%로 뛰고 한 번 더 던질 때마다 10%씩 올라가요(최대 60%). 보크는 없어요.</li>
      <li>멘탈: 득점권에 주자가 있으면 위기 1단계, 만루면 2단계, 3볼이면 0.5단계가 더해져요(도전 모드는 2실점 상태도 1단계). 위기 1단계마다 제구가 (1.05 − 0.1×멘탈) 레벨 떨어져요. 멘탈 8이어도 0.25씩은 흔들려요.</li>
      <li>투구 유형: 오버핸드는 포심·커브·스플리터, 사이드암은 투심·슬라이더, 언더핸드는 투심·체인지업이 강해져요(구종 카드에 보정이 표시돼요). 사이드암·언더핸드는 구속이 느리고 땅볼이 늘며, 좌우 상성(같은 손 타자 유리, 반대 손 타자 불리)이 1.5배·1.8배로 커져요.</li>
      <li>타자 적응: 같은 투수를 두 번째, 세 번째로 상대하는 타자는 컨택 +3%·안타 +4%씩(최대 3단계) 강해지고 유인구에 덜 속아요. 투수를 바꾸면 처음부터 다시 시작해요.</li>
      <li>몸쪽으로 크게 빠진 공은 몸에 맞을 수 있어요(1루 출루).</li>
      <li>좌완·우완: 투수와 같은 손 타자를 만나면 투수가 유리하고(오버핸드 기준 안타 −4%), 반대 손 타자에게는 불리해요(안타 +5%). 좌완은 공이 우완과 반대 방향으로 휘어서 구종 효과 지도도 좌우가 뒤집혀요.</li>
    </ul></article>
  </section>`;

// 자동 타석: 좌·우타자를 고르게 섞어요(좌타 4~5명, 같은 손 3명 연속 없이). 직접 정한 타석은 그대로 둬요.
function mixHands(fixed){
  let hands, guard=0;
  do {
    const nL = Math.random()<0.5 ? 4 : 5;
    hands = Array.from({length:9}, (_,i)=> i<nL ? 'L' : 'R').sort(()=>Math.random()-0.5).map((h,i)=> fixed[i]||h);
  } while (guard++<200 && hands.some((h,i)=> i>=2 && !fixed[i] && h===hands[i-1] && h===hands[i-2]));
  return hands;
}
function makeLineup(){
  if (S.mode==='legend') return LEGEND_TEAMS[S.team].rows.map((r,i)=>genBatter(i, S.diff, r.hand, hitterProf(r)));
  if (S.mode==='allstar') return starBats().map((r,i)=>genBatter(i, S.diff, r.hand, hitterProf(r)));
  const cfg = S.lineupCfg, hands = mixHands(cfg.map(c=>c.hand==='auto'?null:c.hand));
  return cfg.map((c,i)=>genBatter(i, S.diff, hands[i], {name: c.name.trim()||null, type: c.type==='auto'?null:c.type, app: (!c.app||c.app==='auto')?null:c.app,
    spd: (!c.spd||c.spd==='auto') ? null : rand(...SPD_RANGE[c.spd])}));
}

}
function ctxNow(k){

// 베이스에는 주자 정보가 들어가요: {bi, name, spd, hold}. hold는 견제받은 횟수(리드가 짧아져요)

const fresh = r => r ? {...r, hold:0} : 0;            // 베이스를 옮기면 리드가 새로 시작돼요
const speedKo = sp => sp>=0.7 ? '빠름' : sp>=0.4 ? '보통' : '느림';
// running: 히트앤런처럼 미리 뛰고 있던 주자의 베이스 번호(0=1루, 1=2루)
function hitAdvance(bases, n, br, running=-1){
  let runs=0; const nb=[0,0,0];
  const ex = n===1 ? [1,2,1] : n===2 ? [2,2,2] : [3,3,3];
  for (let i=2;i>=0;i--) if (bases[i]){ const to=i+ex[i]+(i===running?1:0); if (to>=3) runs++; else if (!nb[to]) nb[to]=fresh(bases[i]); else runs++; }
  if (n>=4) runs++; else nb[n-1]=br;
  return {nb, runs};
}
function walkAdvance(b, br){
  const nb=[...b]; let runs=0;
  if (nb[0]){ if (nb[1]){ if (nb[2]) runs++; nb[2]=fresh(nb[1]); } nb[1]=fresh(nb[0]); }
  nb[0]=br; return {nb, runs};
}
// 투구 전에 주자가 뛸지 정해요 (앞 베이스가 비어 있어야 해요)
function pickStealer(){
  const g = S.g, b = g.bases, ph = phOf(g.staff[g.pi]);
  if (g.outs>=3 || g.bunt) return null;
  let from = -1;
  if (b[1] && !b[2]) from = 1; else if (b[0] && !b[1]) from = 0;
  if (from<0) return null;
    return Math.random() < stealAttemptProb(b[from], from, g.outs, ph) ? from : null;
}
function doThrow(){
  const g = S.g; if (!g || g.abOver) return;
  const k = g.sel.k, z = g.sel.z; if (z==null || !k) return;
  const bat = g.lineup[g.bi];
  const ctx = ctxNow(k);
  const lv = effLv(k), f = fatigueNow();
  markCrisis();
  const stealFrom = pickStealer();
  const e = expectedOutcome(bat, k, lv, z, ctx);
  const r = throwPitch(bat, k, lv, z, ctx);
  r.exp = {hit:e.hit, whiff:e.whiff, ball:e.ball+e.hbp};
  if (g.bunt && !buntValid()){ g.bunt = null; }
  if (g.bunt){
    const kind = g.bunt, br = buntResult(bat, r.zone, lv.stuff, kind==='squeeze');
    r.bunt = kind; r.bases = 0; r.bb = null;
    if (br==='ball') r.result = r.result==='hbp' ? 'hbp' : 'ball';
    else if (br==='pop'){ r.result = 'out'; r.bb = 'bpop'; }
    else if (br==='fair') r.result = 'bunt';
    else r.result = br;
    r.exp = null;
    r.notes = [{t: kind==='squeeze' ? '스퀴즈 번트!' : '희생번트 시도', good:false}];
    if (br==='pop' && CELLS[r.zone].y<3) r.notes.push({t:'높은 공이라 번트가 떴어요', good:true});
    else if (br==='foul' || br==='whiff') r.notes.push({t: CELLS[r.zone].y<3 ? '높은 공에 번트 실패' : '번트 실패', good:true});
    if (kind==='squeeze') g.bunt = null;   // 스퀴즈는 한 번만
  }
  if (f>0) r.notes.push({t:`피로 (구위·제구 −${(1.5*f).toFixed(1)})`, good:false});
  const cr = crisisNow(); if (cr.lv>0){ const md = mentalDrop(cr.lv, curP().mental); r.notes.push({t:`위기: ${cr.why.join('·')} (제구 −${md.toFixed(1)})`, good:false}); }
  r.count = {...g.count}; r.n = g.ab.length+1; r.pi = g.pi;
  intelPitch(g.bi, r);
  g.ab.push(r); g.event = null;
  g.pc[g.pi]++; g.ps[g.pi].P++;
  // 체력 부하: 공 1개 = 1, 주자가 있으면 +0.15(세트 포지션), 한 타자와 6구째부터는 공마다 +0.5(긴 승부)
  g.load[g.pi] += 1 + (g.bases.some(x=>x)?0.15:0);
  if (r.n>5) drain(0.5, '긴 승부');
  const st = g.st; st.P++;
  const bp = st.byP[k] || (st.byP[k] = {n:0,strikes:0,swings:0,whiffs:0,bip:0,hits:0});
  bp.n++;
  if (r.result!=='ball' && r.result!=='hbp'){ st.strikes++; bp.strikes++; }
  if (['whiff','foul','out','hit','bunt'].includes(r.result)){ st.swings++; bp.swings++; }
  if (r.result==='whiff'){ st.whiffs++; bp.whiffs++; }
  if (r.result==='out'||r.result==='hit') bp.bip++;
  if (r.result==='hit') bp.hits++;

  let end=null;
  if (r.result==='hbp') end='HBP';
  else if (r.result==='ball'){ if (++g.count.b===4) end='BB'; }
  else if (r.result==='called'||r.result==='whiff'){ if (++g.count.s===3) end='K'; }
  else if (r.result==='foul'){ if (g.count.s<2) g.count.s++; }
  else if (r.result==='out') end='OUT';
  else if (r.result==='bunt') end='BUNT';
  else end='H';
  // 스퀴즈 헛스윙: 뛰던 3루 주자가 홈에서 아웃
  if (r.bunt==='squeeze' && r.result==='whiff' && g.bases[2]){
    const before = g.outs, rn = g.bases[2]; g.bases[2] = 0; g.outs++;
    r.steal = {text:`스퀴즈 실패 · ${rn.name} 홈에서 아웃`, tone:'good'};
    if (end) { g.outs = Math.min(g.outs, 3); }
    midInningOut(before, '스퀴즈 실패 · 3아웃');
  }
  g.last = {r, end};

  // 도루: 파울이면 귀루, 공이 맞아 나가면 히트앤런, 볼넷·사구면 밀어내기로 대신 진루
  let running = -1;
  if (stealFrom!=null){
    const runner = g.bases[stealFrom];
    if (r.result==='foul') r.steal = {text:`${runner.name} 도루 시도 · 파울로 귀루`, tone:''};
    else if (end==='OUT' || end==='H'){ running = stealFrom; r.steal = {text:`${runner.name} 스타트 · 히트앤런`, tone:''}; }
    else if (end==='BB' || end==='HBP'){ /* 밀어내기 진루로 처리 */ }
    else r.stealPending = stealFrom;
  }
  if (end) finishPA(end, r, running);
  if (r.stealPending!=null) resolveSteal(r);
  settleHalf();
  render();
}
function resolveSteal(r){
  const g = S.g, from = r.stealPending, runner = g.bases[from], ph = phOf(g.staff[g.pi]);
  delete r.stealPending;
  if (!runner || g.outs>=3) return;
  const st = g.st, ps = g.ps[g.pi], to = ['2루','3루'][from];
  if (Math.random() < stealSuccessProb(runner, from, r.velo, ph)){
    g.bases[from] = 0; g.bases[from+1] = fresh(runner);
    st.SB++; r.steal = {text:`${runner.name} ${to} 도루 성공`, tone:'bad'};
    g.log.unshift({inn:g.inning, sub:true, text:`${runner.name} ${to} 도루 성공`});
  } else {
    const before = g.outs;
    g.bases[from] = 0; g.outs++; st.CS++;
    r.steal = {text:`${runner.name} ${to} 도루 저지!`, tone:'good'};
    g.log.unshift({inn:g.inning, sub:true, text:`${runner.name} ${to} 도루 실패 (아웃)`});
    if (g.abOver){                                       // 삼진 + 도루 저지 같은 경우
      ps.outs += g.outs - before;
      g.abOver.text += ' + 도루 저지'; g.abOver.last = isLast();
    } else midInningOut(before, '도루 저지 · 이닝 종료');
  }
}
// 타석 도중에 주자 아웃으로 3아웃이 되면 이닝이 끝나고, 이 타자는 다음 이닝 첫 타자로 다시 들어와요
function midInningOut(before, text){
  const g = S.g;
  g.ps[g.pi].outs += g.outs - before;
  if (g.outs>=3){ g.outs = 3; g.abOver = {end:'CS3', text, runs:0, keepBatter:true, last: isLast()}; }
}
// 경기 끝: 정해진 이닝의 3아웃, 도전 모드는 3실점
// (정규 경기는 3아웃 때 말 공격을 돌려본 뒤 settleHalf에서 정해요)
function isLast(){
  const g = S.g;
  if (challenge()) return g.st.R >= 3;
  return false;
}

const usName = () => (S.teamUs||'').trim() || '우리';
const oppName = () => S.mode==='legend' ? LEGEND_TEAMS[S.team].team : S.mode==='allstar' ? '올스타' : ((S.teamOpp||'').trim() || '상대');
const tn = (t, cls='') => `<span class="tname ${cls}" title="${esc(t)}">${esc(t)}</span>`;

// ----- 우리 팀 공격(말 공격)과 승패 -----
// 우리는 홈팀: 초에 상대 공격을 막고, 말에 우리 팀이 무작위로 점수를 내요(KBO 평균 이닝당 0.57점 안팎).
const OUR_RUNS = [0.71,0.14,0.075,0.04,0.02,0.01,0.005];
const ourTotal = () => (S.g.our||[]).reduce((a,x)=>a+(x||0),0);
const EXTRA = 2;   // 연장은 11회까지 (KBO 2025년부터의 정규시즌 규정). 짧은 경기도 9회 뒤 연장이에요
// 연장 규칙: 'kbo' = 11회까지 하고 같으면 무승부, 'inf' = 포스트시즌처럼 승부가 날 때까지
const extraEnd = () => S.extra==='inf' ? Infinity : LAST + EXTRA;
const onBaseN = () => S.g.bases.filter(x=>x).length;
const isSaveSit = e => e && e.lead>0 && (e.lead<=3 || e.lead<=e.onBase+2);
function oppScored(runs){
  const g = S.g; if (challenge() || !runs) return;
  const after = ourTotal() - g.st.R, before = after + runs;
  g.tl.push({side:'opp', runs, pi:g.pi});
  if (g.pi!==0 && before>0 && after<=0){ if (isSaveSit(g.entry[g.pi])) g.blown[g.pi] = true; (g.lostLead = g.lostLead||{})[g.pi] = true; }
  // 원정 경기: 마지막 이닝(연장 포함) 말에 상대가 앞서면 끝내기
  if (away() && g.inning>=LAST && g.st.R > ourTotal()) g.walkoff = true;
}
// 홈(말 공격) / 원정(초 공격)
const away = () => S.homeAway==='away' && !challenge();
const defHalf = () => away() ? '말' : '초';
// 원정: 이닝 초에 우리 팀이 먼저 공격해요
function awayTop(i, mo){
  const g = S.g, opp = g.st.R, us = ourTotal();
  const r = pickW(mo ? boostedRuns(mo.b) : OUR_RUNS);
  g.our[i-1] = r;
  if (r) g.tl.push({side:'us', runs:r, pi:g.pi});
  const txt = (mo ? `위기 탈출! 분위기를 탄 ${i}회초 공격(득점 확률 ${pct(1-OUR_RUNS[0])} → ${pct(1-boostedRuns(mo.b)[0])})` : `${i}회초 ${usName()} 공격`)
    + ` · ${r ? r+'득점' : '무득점'} (${usName()} ${us+r} : ${opp} ${oppName()})`;
  g.log.unshift({inn:i, sub:true, text:txt});
  return {r, txt};
}
function settleHalf(){
  const g = S.g, ov = g.abOver;
  if (!ov || ov.settled || g.outs<3 || challenge()) return;
  ov.settled = true;
  const i = g.inning, n = LAST, opp = g.st.R, us = ourTotal();
  if (away()){
    if (i>=n){
      if (us>opp){ ov.last = true; ov.bottom = {text:`경기 종료 · ${usName()} ${us} : ${opp} ${oppName()} 승리`}; return; }
      if (us===opp && i>=extraEnd()){ ov.last = true; ov.bottom = {text:`${i}회말까지 ${us} : ${opp} 무승부`}; return; }
    }
    const t = awayTop(i+1, momentum());
    let txt = t.txt;
    if (i+1>=n && opp > us + t.r){ ov.last = true; txt += ` · ${i+1}회말 없이 경기 종료`; }
    else if (i+1>n) txt += ' · 연장전';
    ov.bottom = {text: txt, runs: t.r};
    return;
  }
  if (i>=n && us>opp){ g.our[i-1] = null; ov.last = true; ov.bottom = {text:`${i}회말 공격 없이 경기 종료 · ${usName()} ${us} : ${opp} ${oppName()} 승리`}; return; }
  const mo = momentum();
  let r = pickW(mo ? boostedRuns(mo.b) : OUR_RUNS);
  if (i>=n && us+r>opp) r = Math.min(r, opp-us+1 + (Math.random()<0.25 ? 1 : 0));   // 끝내기는 이기는 점수에서 끝나요(가끔 홈런으로 더)
  g.our[i-1] = r;
  if (r) g.tl.push({side:'us', runs:r, pi:g.pi});
  const us2 = us + r;
  let txt = (mo ? `위기 탈출! 분위기를 탄 ${i}회말 공격(득점 확률 ${pct(1-OUR_RUNS[0])} → ${pct(1-boostedRuns(mo.b)[0])})` : `${i}회말 ${usName()} 공격`)
    + ` · ${r ? r+'득점' : '무득점'} (${usName()} ${us2} : ${opp} ${oppName()})`;
  if (i>=n){
    if (us2>opp){ ov.last = true; txt += r ? ' · 끝내기 승리!' : ''; }
    else if (us2<opp){ ov.last = true; txt += ' · 경기 종료'; }
    else if (i>=extraEnd()){ ov.last = true; txt += ' · 무승부'; }
    else txt += ' · 동점, 연장전';
  }
  ov.bottom = {text: txt, runs: r};
  g.log.unshift({inn:i, sub:true, text:txt});
}
// ----- 위기 탈출 → 말 공격 분위기 -----
// 득점권 위기(위기 1단계 이상)를 맞은 뒤 실점 없이 이닝을 끝내면, 말 공격 득점 확률이 올라가요.
// 위기 정점이 클수록 더 많이: 득점권 ×1.35, 만루 ×1.7, 만루+3볼 ×1.875 (득점할 확률 기준)
function markCrisis(){
  const g = S.g, cr = crisisNow();
  if (challenge() || cr.lv < 1) return;
  g.halfPeak = Math.max(g.halfPeak||0, cr.lv);
  if (g.crisisStart==null) g.crisisStart = g.st.R;
}
function momentum(){
  const g = S.g;
  if (!g.halfPeak || g.crisisStart==null || g.st.R !== g.crisisStart) return null;
  return {peak: g.halfPeak, b: 1 + 0.35*Math.min(3, g.halfPeak)};
}
function boostedRuns(b){
  const score = Math.min(0.75, (1-OUR_RUNS[0])*b), k = score/(1-OUR_RUNS[0]);
  return OUR_RUNS.map((p,i)=> i===0 ? 1-score : p*k);
}
// 승·패·홀드·세이브 (KBO 공식 기록 규칙을 단순화)
function decisions(){
  const g = S.g, n = S.innings, dec = {};
  let us=0, opp=0, go=null;
  for (const e of g.tl){
    const before = us-opp; if (e.side==='us') us+=e.runs; else opp+=e.runs; const after = us-opp;
    if (before<=0 && after>0) go = {side:'us', pi:e.pi};
    if (before>=0 && after<0) go = {side:'opp', pi:e.pi};
  }
  const res = us>opp ? 'W' : us<opp ? 'L' : 'T';
  const add = (i,t) => (dec[i] = dec[i] || []).push(t);
  const fin = g.used[g.used.length-1];
  const reqOuts = Math.max(1, Math.floor(n*5/9*3));   // 선발승 최소 이닝: 9이닝 경기면 5이닝
  let win = null;
  if (res==='W' && go){
    win = go.pi;
    if (win===0 && g.ps[0].outs < reqOuts){ const rel = g.used.filter(i=>i!==0).sort((a,b)=>g.ps[b].outs-g.ps[a].outs); if (rel.length) win = rel[0]; }
    add(win, '승');
    const e = g.entry[fin];
    const o = g.ps[fin].outs;
    // 세이브: 승리 투수가 아닌 마무리 투수가 리드를 지킨 채 끝까지 던지고, 아래 셋 중 하나
    //  ① 3점 차 이내에서 나와 1이닝 이상  ② 동점 주자가 누상·타석·대기 타석에 있을 때 나와 아웃 1개 이상  ③ 점수 차와 상관없이 3이닝 이상
    const held = e && e.lead>0 && !(g.lostLead && g.lostLead[fin]);
    if (fin!==win && fin!==0 && held && ((e.lead<=3 && o>=3) || (e.lead<=e.onBase+2 && o>=1) || o>=9)) add(fin, '세');
  }
  if (res==='L' && go) add(go.pi, '패');
  for (const i of g.used){
    if (i===0 || i===fin || dec[i]) continue;
    if (isSaveSit(g.entry[i]) && !g.blown[i] && g.ps[i].outs>=1 && (g.exitLead[i]||0)>0) add(i, '홀');
  }
  for (const i in g.blown) add(i, '블론');
  return {res, us, opp, dec, win};
}
// 타석 도중(견제 악송구 등)에 도전 모드 3실점이 되면 바로 끝나요
function checkChallengeEnd(text){
  const g = S.g;
  if (challenge() && g.st.R>=3 && !g.abOver) g.abOver = {end:'CH', text, runs:0, keepBatter:true, last:true};
}
// 견제: 한 타석에 3번까지는 악송구가 드물고, 4번째부터는 악송구 확률이 크게 올라가요 (보크 없음)
const pickoffErr = n => n<=3 ? 0.02 : Math.min(0.6, 0.25 + 0.1*(n-4));
function doPickoff(base){
  const g = S.g; if (!g || g.abOver || !g.bases[base]) return;
  const runner = g.bases[base], ph = phOf(g.staff[g.pi]), to = ['1루','2루'][base];
  g.diseng = (g.diseng||0) + 1; g.last = null;
  drain(0.4, '');
  if (Math.random() < pickoffProb(runner, base, ph)){
    const before = g.outs;
    g.bases[base] = 0; g.outs++; g.st.PK++;
    g.event = {big:'견제사!', tone:'good', sub:`${runner.name} ${to}에서 아웃`};
    g.log.unshift({inn:g.inning, sub:true, text:`${runner.name} ${to} 견제사`});
    midInningOut(before, '견제사 · 이닝 종료');
  } else if (Math.random() < pickoffErr(g.diseng)){
    const nb=[...g.bases]; let runs=0;
    nb[base]=0; if (base===1){ if (nb[2]) runs++; nb[2]=fresh(runner); } else { if (!nb[1]) nb[1]=fresh(runner); else nb[base]=runner; }
    g.bases = nb; scoreRuns(runs);
    g.event = {big:'견제 악송구', tone:'bad', sub:`${g.diseng}번째 견제 · ${runner.name} 한 베이스 진루${runs?` · ${runs}실점`:''}`};
    g.log.unshift({inn:g.inning, sub:true, text:`견제 악송구 (${g.diseng}번째) · ${runner.name} 진루${runs?` +${runs}`:''}`});
    checkChallengeEnd(`견제 악송구 실점 · 3실점`);
  } else {
    runner.hold = Math.min(3, (runner.hold||0)+1);
    g.event = {big:'견제', tone:'', sub:`${runner.name} 귀루 · 리드가 짧아졌어요 (도루 시도 −${25*runner.hold}%, 성공 −${4*runner.hold}%)`};
  }
  settleHalf();
  render();
}
function scoreRuns(runs){
  if (!runs) return;
  const g = S.g; g.st.R += runs; g.ps[g.pi].R += runs; g.inningRuns[g.inning-1] += runs; drain(runs, '실점'); oppScored(runs);
  if (g.walkoff && !g.abOver) g.abOver = {end:'WO', text:'끝내기 실점 · 경기 종료', runs:0, keepBatter:true, last:true, bad:true};
}
function finishPA(end, r, running=-1){
  const g = S.g, st = g.st, bat = g.lineup[g.bi], ps = g.ps[g.pi], outsBefore = g.outs, br = runnerOf(bat);
  st.PA++; ps.BF++;
  g.faced[g.pi][g.bi]++;
  let text, runs=0, tok, isHit = end==='H', bad = false;
  if (end==='BUNT'){
    const o = buntPlay(g, bat, r.bunt);
    runs = o.runs; text = o.text; tok = o.tok; isHit = !!o.hit; bad = !!(o.hit || o.err);
    if (o.hit){ st.AB++; st.H++; ps.H++; drain(1, '번트 안타 허용'); }
    else if (!o.sh) st.AB++;
    if (o.sh) st.SH = (st.SH||0)+1;
    if (o.err) st.E = (st.E||0)+1;
  }
  else if (end==='BB'){ const a=walkAdvance(g.bases, br); g.bases=a.nb; runs=a.runs; st.BB++; ps.BB++; text='볼넷'; tok='BB'; }
  else if (end==='IBB'){ const a=walkAdvance(g.bases, br); g.bases=a.nb; runs=a.runs; st.BB++; st.IBB=(st.IBB||0)+1; ps.BB++; text='고의사구'; tok='IBB'; }
  else if (end==='HBP'){ const a=walkAdvance(g.bases, br); g.bases=a.nb; runs=a.runs; st.HBP++; ps.HBP++; text='몸에 맞는 공'; tok='HBP'; }
  else if (end==='K'){ g.outs++; st.AB++; st.K++; ps.K++; text = r.result==='called'?'루킹 삼진':'헛스윙 삼진'; tok='K'; }
  else if (end==='OUT'){
    const o = r.bb==='bpop' ? buntPop(g, bat, r.bunt) : outPlay(g, bat, r.bb || 'gb', running);
    if (o.err){ st.E = (st.E||0)+1; bad = true; }
    if (r.bb==='ld') drain(1, '잘 맞은 직선타');
    else if (r.bb==='fb') drain(typeOf(bat)==='power'?1:0.5, typeOf(bat)==='power'?'큰 뜬공':'');
    runs = o.runs; text = o.text; tok = o.tok;
    if (!o.sf) st.AB++;
    if (o.dp) st.DP++;
  } else {
    const a = hitAdvance(g.bases, r.bases, br, running); g.bases=a.nb; runs=a.runs; st.AB++; st.H++; ps.H++; if (r.bases===4) st.HR++;
    text = hitDesc(bat, r.bases); tok = ['','1B','2B','3B','HR'][r.bases];
    drain([0,2,3,3,4][r.bases], HIT_NAME[r.bases]+' 허용');
  }
  if (end==='BB'||end==='HBP') drain(1, end==='BB'?'볼넷':'몸에 맞는 공');
  if (runs && end!=='IBB') drain(runs, '실점');   // 고의사구는 밀어내기 실점이 나도 체력 소모 없음
  st.R += runs; ps.R += runs; g.inningRuns[g.inning-1] += runs;
  if (runs) oppScored(runs);
  g.results[g.bi].push({tok, h:isHit, txt:text.split(' · ')[0], rbi:(tok==='E'||tok==='DP')?0:runs, inn:g.inning});
  intelPA(g.bi, end);
  g.log.unshift({inn:g.inning, name:bat.name, order:bat.order, text, np:g.ab.length, runs, hit:isHit, sit:sitText(), score:scoreText(), err:tok==='E', bb:end==='BB'||end==='HBP'||end==='IBB'});
  if (g.outs>3) g.outs = 3;
  ps.outs += g.outs - outsBefore;
  g.abOver = {end, text, runs, last: isLast(), bad};
  if (challenge() && g.st.R>=3) g.abOver.text += ' · 3실점';
  if (g.walkoff){ g.abOver.last = true; g.abOver.text += ' · 끝내기 패배'; }
}
// 범타 처리: 병살, 진루타, 희생플라이 (running: 투구와 동시에 뛰던 주자). 잡은 수비수까지 기록해요.
function outPlay(g, bat, bb, running=-1){
  const before = g.outs, b = g.bases, pos = fielderOf(bat, bb), who = POS_KO[pos];
  let runs = 0, text, tok, dp = false, sf = false;
  // 수비 실책: 아웃이 될 타구를 놓치거나(포구) 잘못 던져요(송구, 한 베이스 더)
  if (Math.random() < (ERR_RATE[bb]||0)){
    const thr = pos<=6 && Math.random()<0.25, step = thr ? 2 : 1, nb = [0,0,0];
    for (let i=2;i>=0;i--){ if (!b[i]) continue; const t = i+step; if (t>=3) runs++; else nb[t] = fresh(b[i]); }
    nb[step-1] = runnerOf(bat); g.bases = nb;
    const kind = thr ? '송구 실책' : bb==='gb' ? '포구 실책' : '낙구 실책';
    return {runs, text:`${who} ${kind}${thr?' · 타자 2루까지':''}`, tok:'E', err:true};
  }
  if (bb==='gb'){
    if (b[0] && before<2 && running!==0 && Math.random()<dpChance(bat, pos)){
      dp = true; g.outs += 2;
      if (g.outs<3){ if (b[2]) runs++; g.bases = [0,0,b[1]?fresh(b[1]):0]; }
      text = `${who} 앞 병살타 (${DP_CHAIN[pos]})`; tok = 'DP';
    } else {
      g.outs += 1;
      if (g.outs<3){
        const nb=[0,0,0]; let moved=false;
        if (b[2]){ if (Math.random()<0.55){ runs++; moved=true; } else nb[2]=b[2]; }
        if (b[1]){ if (!nb[2] && (running===1 || Math.random()<0.7)){ nb[2]=fresh(b[1]); moved=true; } else nb[1]=b[1]; }
        if (b[0]){ if (!nb[1]){ nb[1]=fresh(b[0]); moved=true; } else if (!nb[2]){ nb[2]=nb[1]; nb[1]=fresh(b[0]); moved=true; } else nb[0]=b[0]; }
        g.bases = nb;
        text = `${who} 땅볼` + (runs ? ' · 타점' : moved ? (running>=0 ? ' · 진루타 (런앤히트로 병살 피함)' : ' · 진루타') : '');
      } else text = `${who} 땅볼`;
      tok = '땅';
    }
  } else if (bb==='fb'){
    g.outs += 1;
    const fly = pos===2 ? '포수 파울플라이' : pos<7 ? `${who} 내야 뜬공` : `${who} 뜬공`;
    if (g.outs<3 && running>=0 && Math.random()<0.25){   // 뛰던 주자가 귀루 못 하고 더블아웃
      g.outs += 1; dp = true; g.bases[running] = 0; text = `${fly} · 주자 귀루 실패 더블아웃`; tok = 'DP';
    } else if (pos>=7 && g.outs<3 && b[2] && Math.random() < ((bat.type==='power')?0.85:0.72)){
      runs++; sf = true; const nb=[b[0],0,0];
      if (b[1] && Math.random()<0.3) nb[2]=fresh(b[1]); else nb[1]=b[1];
      g.bases = nb; text = `${who} 희생플라이`; tok = 'SF';
    } else { text = fly; tok = '뜬'; }
  } else {
    g.outs += 1;
    const lead = running>=0 ? running : b[1] ? 1 : b[0] ? 0 : -1;
    if (g.outs<3 && lead>=0 && Math.random()<(running>=0?0.5:0.1)){
      g.outs += 1; dp = true; g.bases[lead] = 0; text = `${who} 직선타 병살`; tok = 'DP';
    } else { text = `${who} 직선타`; tok = '직'; }
  }
  return {runs, text, tok, dp, sf};
}
// ----- 번트 처리 -----
// 굴린 번트: 번트 안타 / 야수선택(선행 주자 아웃) / 실책 / 희생번트(성공)
function buntPlay(g, bat, kind){
  const b = g.bases, pos = pickN([[1,.35],[5,.33],[3,.27],[2,.05]]), who = POS_KO[pos], sp = bat.spd!=null ? bat.spd : 0.5, br = runnerOf(bat);
  let runs = 0;
  const adv = () => { const nb=[0,0,0]; if (b[2]) runs++; if (b[1]) nb[2]=fresh(b[1]); if (b[0]) nb[1]=fresh(b[0]); return nb; };
  const pErr = 0.03, pHit = 0.03 + 0.10*sp, pFC = kind==='squeeze' ? 0.12 : 0.15*(1-0.4*sp), x = Math.random();
  if (x < pErr){ const nb = adv(); nb[0] = br; g.bases = nb; return {runs, text:`${who} 번트 타구 송구 실책 · 모두 세이프`, tok:'E', err:true}; }
  if (x < pErr+pHit){ const nb = adv(); nb[0] = br; g.bases = nb; return {runs, text:`${who} 앞 번트 안타`, tok:'1B', hit:true}; }
  if (x < pErr+pHit+pFC){
    g.outs++;
    if (kind==='squeeze' && b[2]){ g.bases = [br, b[0]?fresh(b[0]):0, b[1]?fresh(b[1]):0]; return {runs:0, text:`${who} 앞 스퀴즈 · 3루 주자 홈에서 아웃 (야수선택)`, tok:'FC'}; }
    g.bases = [br, (b[0]&&b[1]) ? fresh(b[0]) : 0, b[2]||0];
    return {runs:0, text:`${who} 앞 번트 · 선행 주자 ${b[1]?'3루':'2루'}에서 아웃 (야수선택)`, tok:'FC'};
  }
  g.outs++;
  if (g.outs>=3) return {runs:0, text:`${who} 앞 희생번트 · 3아웃`, tok:'SH', sh:true};
  g.bases = adv();
  return {runs, text: kind==='squeeze' ? `${who} 앞 스퀴즈 번트 성공 · 3루 주자 득점` : `${who} 앞 희생번트 성공 · 주자 진루`, tok:'SH', sh:true};
}
// 번트 뜬공: 주자는 그대로. 스퀴즈 때는 뛰던 3루 주자까지 더블아웃되기 쉬워요.
function buntPop(g, bat, kind){
  const pos = pickN([[2,.4],[1,.35],[5,.15],[3,.1]]), who = POS_KO[pos];
  g.outs++;
  if (kind==='squeeze' && g.bases[2] && g.outs<3 && Math.random()<0.6){ g.outs++; g.bases[2] = 0; return {runs:0, text:`${who} 번트 뜬공 · 3루 주자 귀루 못 해 더블아웃`, tok:'DP', dp:true}; }
  return {runs:0, text:`${who} 번트 뜬공`, tok:'뜬'};
}
// 타석 시작 때 번트 작전을 정해요(상대 벤치의 작전)
function decideBunt(){
  const g = S.g; if (!g || g.abOver) return;
  const late = g.inning >= LAST-2 && Math.abs(ourTotal() - g.st.R) <= 1;
  g.bunt = buntIntent(g.lineup[g.bi], g.bases, g.outs, late);
}
// 진행 중에 상황이 바뀌면(주자 아웃, 2스트라이크 등) 번트를 풀어요
function buntValid(){
  const g = S.g, b = g.bases;
  if (!g.bunt) return false;
  if (g.count.s>=2) return false;
  if (g.bunt==='squeeze') return !!b[2] && g.outs<2;
  return g.outs===0 && (!!b[0] || !!b[1]) && !b[2];
}
// 투수 교체: 한 번 내려간 투수는 다시 못 올라와요. 볼카운트는 그대로 이어져요.
function penAvail(){ const st = S.g.staff; return st.map((p,i)=>i).filter(i=>!S.g.used.includes(i) && Object.keys(st[i].build).length); }
function substitute(i){
  const g = S.g; if (!penAvail().includes(i)) return;
  const from = pLabel(g.staff[g.pi]), lead = ourTotal() - g.st.R;
  g.exitLead[g.pi] = lead;
  g.entry[i] = {lead, onBase: onBaseN()};
  g.pi = i; g.used.push(i); g.pen = false;
  g.sel.k = owned()[0]; g.sel.z = null;
  g.log.unshift({inn:g.inning, sub:true, text:`투수 교체 · ${from} → ${pLabel(g.staff[i])} (${g.pc[g.used[g.used.length-2]]}구 투구)`});
}
// 도전 모드 기록: 버틴 아웃카운트
function finishGame(){
  const g = S.g; if (g.done) return; g.done = true;
  if (!challenge()){ g.exitLead[g.pi] = ourTotal() - g.st.R; g.final = decisions(); return; }
  g.chOuts = (g.inning-1)*3 + Math.min(g.outs,2) + (g.outs>=3?1:0);
  const best = loadBest(), key = bestKey(), prev = best[key];
  g.chPrev = prev ? prev.outs : null;
  if (!prev || g.chOuts > prev.outs){
    best[key] = {outs:g.chOuts, label:`${MODES[S.mode].label}${S.mode==='legend'?' '+LEGEND_TEAMS[S.team].label:''} · ${DIFFS[S.diff].label}`};
    saveBest(best); g.chNew = true;
  }
}
function nextBatter(){
  const g = S.g; if (!g.abOver) return;
  if (g.abOver.last){ finishGame(); S.screen='result'; render(); return; }
  let chg = null;
  if (g.outs>=3){
    const prev = g.inning, ra = g.inningRuns[prev-1]||0, bot = g.abOver.bottom;
    g.inning++; g.outs=0; g.bases=[0,0,0]; g.inningRuns.push(0); g.halfPeak=0; g.crisisStart=null;
    chg = {prev, ra, bot};
  }
  if (!g.abOver.keepBatter) g.bi = (g.bi+1)%9;
  g.count={b:0,s:0}; g.ab=[]; g.abOver=null; g.last=null; g.event=null; g.diseng=0; g.sel.z=null;
  if (chg){
    // 이닝이 바뀌면 크게 알려요: 새 이닝, 지난 이닝 실점, 우리 공격 결과, 스코어
    const i = g.inning, extra = !challenge() && i>LAST, ch = challenge();
    const parts = [`${chg.prev}회${defHalf()} ${chg.ra ? chg.ra+'실점' : '무실점'}`];
    if (chg.bot && chg.bot.text) parts.push(esc(chg.bot.text.replace(/\(득점 확률[^)]*\)/,'').split(' (')[0]));
    if (!ch) parts.push(`${tn(away()?usName():oppName())} ${away()?ourTotal():g.st.R} : ${away()?g.st.R:ourTotal()} ${tn(away()?oppName():usName())}`);
    else parts.push(`도전 모드 실점 ${g.st.R} / 3`);
    g.event = {big:`${extra?'연장 ':''}${i}회${defHalf()} 수비 시작`, tone:'', cls:'inn', sub: parts.join(' · '), batter: g.lineup[g.bi].order+'번 '+g.lineup[g.bi].name+' 타석부터'};
  }
  decideBunt();
  render();
}

// ---------- 경기 화면 ----------
function renderBoard(){
  const g = S.g, ch = challenge(), n = Math.max(LAST, g.inning, g.our.length), from = Math.max(1, n-8), aw = away(), pre = startInn();
  let head='', row='', row2='';
  for (let i=from;i<=n;i++){
    head += `<th>${i}</th>`;
    const v = i<=g.inning ? g.inningRuns[i-1] : '';
    row += `<td class="${i===g.inning?'now':''}${i<pre?' pre':''}">${v===undefined?'':v}</td>`;
    const u = g.our[i-1];
    row2 += `<td class="${i<pre?'pre':''}">${aw ? (u==null ? '' : u) : (i<g.inning || (i===g.inning && g.abOver && g.abOver.settled) ? (u==null ? 'X' : u) : '')}</td>`;
  }
  const us = ourTotal();
  const oppRow = `<tr><td style="color:#8ea0ba">${tn(oppName(),'cell')}</td>${row}<td class="tot">${g.st.R}</td></tr>`;
  const usRow = ch ? '' : `<tr><td style="color:#ffd166">${tn(usName(),'cell')}</td>${row2}<td class="tot">${us}</td></tr>`;
  const lights = (cls,lbl,on,max)=>`<b>${lbl}</b><span class="${cls}">${Array.from({length:max},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}</span>`;
  const outsShown = Math.min(g.outs,2);
  const b = g.bases, base=(x,y,on)=>`<rect x="${x-9}" y="${y-9}" width="18" height="18" transform="rotate(45 ${x} ${y})" fill="${on?'#ffd166':'none'}" stroke="${on?'#ffd166':'#5b6d8f'}" stroke-width="2"/>`;
  return `<section class="panel board" aria-label="스코어보드">
    <p class="ph ${g.event&&g.event.cls==='inn'?'innflash':''}"><span>${g.inning}회${defHalf()} · 수비 중${ch?' · 도전 모드':g.inning>LAST?' · 연장':''}</span>${ch ? `<span>실점 <b class="mono" style="color:#fff">${g.st.R}</b> / 3</span>` : (aw ? `<span>${tn(usName())} <b class="mono" style="color:#ffd166">${us}</b> : <b class="mono" style="color:#fff">${g.st.R}</b> ${tn(oppName())}</span>` : `<span>${tn(oppName())} <b class="mono" style="color:#fff">${g.st.R}</b> : <b class="mono" style="color:#ffd166">${us}</b> ${tn(usName())}</span>`)}</p>
    <table class="lines"><tr><th></th>${head}<th class="tot">R</th></tr>${aw ? usRow + oppRow : oppRow + usRow}</table>
    <div class="bso">
      <div class="lights">${lights('b','B',g.count.b,3)}${lights('s','S',g.count.s,2)}${lights('o','O',g.outs>=3?2:outsShown,2)}</div>
      <svg class="diamond" viewBox="0 0 78 62" aria-label="주자 상황">${base(39,12,b[1])}${base(64,34,b[0])}${base(14,34,b[2])}<path d="M33 52 h12 v5 l-6 5 l-6 -5z" fill="#5b6d8f"/></svg>
    </div>
    ${runnerPanel()}
    <div class="pcount"><span>팀 투구수 <b>${g.st.P}</b></span><span>${g.outs>=3?'3아웃':`${g.outs}아웃`}</span></div>
    ${pitcherStatus()}
  </section>`;
}
function runnerPanel(){
  const g = S.g, rows = [];
  ['1루','2루','3루'].forEach((nm,i)=>{ const r = g.bases[i]; if (!r) return;
