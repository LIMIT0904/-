    else exp[g.sel.z] = expectedOutcome(bat, k, lv, g.sel.z, ctx);
  }
  if (showOv){
    vals = exp.map(e=>overlayValue(e, mode));
    lo = Math.min(...vals); span = Math.max(Math.max(...vals)-lo, 0.02);
  }
  const ovColor = mode==='hit'?HOT : mode==='whiff'?COLD : '#5d6b7e';
  const cell = i => {
    let style='', html='';
    if (showOv){ const v=vals[i], t=(0.08+0.92*(v-lo)/span)*0.85; style=`background:${mix(WHITE,ovColor,t)};${textOn(t)}`; html=`<span class="ov">${Math.round(v*100)}</span>`+html; }
    return {act: g.abOver ? null : `zone:${i}`, cls: g.sel.z===i ? 'sel' : '', style, html};
  };
  // 그림 위 레이어: 제구 범위 원, 마지막 공의 빗나간 궤적, 투구 위치 번호
  let svg = '';
  if (g.sel.z!=null && !g.abOver){
    const [ax,ay] = aimPoint(g.sel.z, lv.ctrl), sg = sigmaOf(lv.ctrl);
    svg += `<circle cx="${ax}" cy="${ay}" r="${(2*sg).toFixed(3)}" class="r2"/><circle cx="${ax}" cy="${ay}" r="${sg.toFixed(3)}" class="r1"/>`;
  }
  const lastP = g.ab[g.ab.length-1];
  if (lastP && g.last && lastP.miss && lastP.x!=null){
    const t = CELLS[lastP.target];
    svg += `<line x1="${t.cx}" y1="${t.cy}" x2="${lastP.x}" y2="${lastP.y}" class="ml"/><circle cx="${t.cx}" cy="${t.cy}" r="0.45" class="mt"/>`;
  }
  const lim = v => Math.max(-BAND+0.3, Math.min(9+BAND-0.3, v));
  const marks = g.ab.map(p=>{
    const x = p.x!=null ? p.x : CELLS[p.zone].cx, y = p.y!=null ? p.y : CELLS[p.zone].cy;
    return `<span class="mk ${p===lastP&&g.last?'fresh':''}" style="--mc:${PITCHES[p.key].color};left:${UP(lim(9-x))};top:${UP(lim(y))}">${p.n}</span>`; }).join('');
  const overlay = batterFig(shownBat(bat, g.bi), showOv, !knows(g.bi,'type')) + (showOv ? '' : bandLabels()) + `<svg class="fgsvg" viewBox="${-BAND} ${-BAND} ${SPAN} ${SPAN}" aria-hidden="true"><g transform="translate(9 0) scale(-1 1)">${svg}</g></svg>${marks}`;

  let callout;
  if (g.event){
    callout = `<div class="callout flash ${g.event.cls||''}" aria-live="polite"><div class="big ${g.event.tone}">${g.event.cls==='inn'?'<span class="innk">이닝 교체</span>':''}${g.event.big}</div><div class="sub">${g.event.sub}${g.event.batter?` · ${esc(g.event.batter)}`:''}</div></div>`;
  } else if (g.last){
    const {r} = g.last, ov = g.abOver;
    const big = ov ? ov.text : r.bunt && r.result==='foul' ? '번트 파울' : r.bunt && r.result==='whiff' ? '번트 헛스윙' : (r.result==='hit'?HIT_NAME[r.bases]:RES_LABEL[r.result]);
    const tone = ov ? ((ov.end==='K'||ov.end==='OUT'||ov.end==='CS3'||ov.end==='BUNT') && !ov.bad ? 'good':'bad') : (['called','whiff'].includes(r.result)?'good':r.result==='hbp'?'bad':'');
    const where = r.miss ? `${zn(r.target)} 노림 → <b style="color:var(--seam)">${zn(r.zone)}</b>` : zn(r.zone);
    const runs = ov && ov.runs ? ` · <b style="color:var(--seam)">${ov.runs}실점</b>` : '';
    const reveal = (r.exp && !hide) ? `<div class="reveal">던지기 전 예상 · 안타 <b>${pct(r.exp.hit)}</b> · 헛스윙 <b>${pct(r.exp.whiff)}</b> · 볼 <b>${pct(r.exp.ball)}</b></div>` : '';
    const notes = (r.notes && r.notes.length) ? `<div class="notes" style="justify-content:center;margin-top:6px">${r.notes.map(n=>`<span class="${n.good?'g':'b'}">${r.bunt?'':(n.good?'▼ 컨택 · ':'▲ 컨택 · ')}${n.t}</span>`).join('')}</div>` : '';
    const stl = r.steal ? `<div class="steal ${r.steal.tone}">${r.steal.text}</div>` : '';
    callout = `<div class="callout flash" aria-live="polite"><div class="big ${tone}">${big}</div><div class="sub">${PITCHES[r.key].short} ${r.velo.toFixed(0)}km/h · ${where}${runs}</div>${stl}${reveal}${notes}</div>`;
  } else callout = `<div class="callout"><div class="idle">${g.bunt && buntValid() ? `<b style="color:var(--seam)">${g.bunt==='squeeze'?'스퀴즈 낌새!':'상대가 번트 자세를 잡았어요.'}</b> 높은 공을 던지면 번트가 뜨거나 파울이 나기 쉬워요. ` : ''}구종을 고르고 존에서 노릴 칸을 클릭하세요 (방향키로도 움직일 수 있어요)</div></div>`;

  let pred;
  if (g.pen){
    const av = penAvail();
    pred = `<div class="pt">불펜<span>한 번 내려간 투수는 다시 못 올라와요 · 볼카운트는 그대로 이어져요</span></div>
      <div class="pen">${av.map(i=>{ const p=g.staff[i];
        return `<div class="penrow"><div><b>${p.name?esc(p.name)+' · ':''}${p.role} · ${phKo(phOf(p))} ${slotOf(p.slot).label}</b> <span class="muted">체력 Lv.${p.sta} · ${pitchesOf(capOf(p,i))}구 안팎 · 멘탈 Lv.${p.mental||1}</span>
          <div class="penp">${PITCH_ORDER.filter(k=>p.build[k]).map(k=>{ const es=Math.max(0,p.build[k].stuff+slotMod(p,k)); return `<span><i style="background:${PITCHES[k].color}"></i>${PITCHES[k].short} ${veloP(p,k,es).toFixed(0)}km/h · 구위${fmtLv(es)} 제구${p.build[k].ctrl}</span>`; }).join('')}</div></div>
          <button class="primary small" data-act="sub:${i}">등판</button></div>`; }).join('')}</div>
      <button class="ghost" data-act="pen" style="margin-top:10px">취소</button>`;
  } else if (g.abOver){
    const bt = g.abOver.bottom ? `<b>${g.abOver.bottom.text}</b><br>` : '';
    pred = `<p class="empty">${bt}${g.abOver.last ? (challenge() ? '3실점으로 도전이 끝났어요. 기록을 확인하세요.' : '경기가 끝났어요. 결과를 확인하세요.') : g.abOver.keepBatter ? '주자 아웃으로 이닝이 끝났어요. 이 타자는 다음 이닝 첫 타자로 다시 나와요.' : g.outs>=3 ? '3아웃, 이닝 종료. 다음 이닝으로 넘어가요.' : '타석이 끝났어요. 다음 타자를 상대하세요.'}</p>`;
  } else if (g.sel.z==null){
    pred = `<p class="empty">${!showProb ? '노릴 칸을 고르면 제구 범위가 원으로 표시돼요. 이 공의 예상 확률과 볼배합 효과는 던진 뒤에 공개돼요.' : '노릴 칸을 고르면 이 공의 예상 결과가 나와요. 존의 숫자는 지금 고른 구종으로 각 칸을 노렸을 때의 '+({hit:'안타',whiff:'헛스윙',ball:'볼'}[mode])+' 확률(%)이에요. 제구가 빗나가는 경우까지 포함했어요.'}</p>`;
  } else {
    const e = exp[g.sel.z], z = g.sel.z;
    const notes = e.notes.length ? `<div class="notes">${e.notes.map(n=>`<span class="${n.good?'g':'b'}">${n.good?'▼ 컨택':'▲ 컨택'} · ${n.t}</span>`).join('')}</div>` : '';
    pred = `<div class="pt">${PITCHES[k].name} → ${zn(z)}<span>목표 ±1칸 안 ${pct(e.onTarget)} · 실선 원 안에 약 40%, 점선 원 안에 약 86%</span></div>`
      + (!showProb ? `<p class="empty" style="margin-top:8px">결과 확률은 던진 뒤에 공개돼요.</p>` :
        `<div class="stack">${SEG.map(([key,,c])=>`<i style="width:${e[key]*100}%;background:${c}"></i>`).join('')}</div>
         <ul class="legend">${SEG.map(([key,l,c])=>`<li><i style="background:${c}"></i>${l} <b>${pct(e[key])}</b></li>`).join('')}</ul>` + notes);
  }
  const action = g.abOver
    ? `<button class="primary throw" data-act="next">${g.abOver.last?'경기 결과 보기':g.outs>=3?'다음 이닝':'다음 타자'} <kbd>Space</kbd></button>`
    : `<button class="primary throw" data-act="throw" ${(g.sel.z==null||g.pen)?'disabled':''}>투구 <kbd>Space</kbd></button><button class="ghost ibb" data-act="ibb" ${g.pen?'disabled':''} title="공을 던지지 않고 타자를 1루로 보내요 (체력 소모 없음)">고의사구 <kbd>I</kbd></button>`;

  return `<div class="center">
    <div class="pitchbar" role="group" aria-label="구종 선택">${chips}</div>
    ${broadcastBar()}
    ${callout}
    <div class="zonewrap">
      <div class="side l"></div>
      ${fineGrid('target', cell, overlay)}
      <div class="side r"></div>
      <svg class="plate" viewBox="0 0 100 40" aria-hidden="true"><path d="M5 37 H95 V22 L50 3 L5 22 Z" fill="#fbfcfd" stroke="#14213d" stroke-width="3"/></svg>
      <div class="platecap" id="hoverline">${plateCap()}</div>
    </div>
    ${!showProb?'':`<div class="ovbar"><span>존에 표시할 확률</span><span class="seg small">${[['hit','안타'],['whiff','헛스윙'],['ball','볼']].map(([m,l])=>`<button data-act="overlay:${m}" class="${mode===m?'on':''}">${l}</button>`).join('')}</span></div>`}
    <div class="predict">${pred}</div>
    <div class="actions">${action}</div>
  </div>`;
}

    <td class="res ${p.result==='hit'?'h':''}">${p.result==='hit'?HIT_NAME[p.bases]:p.result==='out'&&p.bb?({gb:'땅볼',fb:'뜬공',ld:'직선타',bpop:'번트 뜬공'}[p.bb]):p.result==='bunt'?'번트':(p.bunt&&p.result==='foul')?'번트 파울':(p.bunt&&p.result==='whiff')?'번트 헛스윙':(RES_LABEL[p.result]||p.result).replace(' 스트라이크','')}</td></tr>`).join('');

  </section>

    ${g.log.length?`<ul class="glog">${glog}</ul>`:'<p class="muted" style="margin:0;font-size:13px">타석 결과가 여기에 쌓여요.</p>'}
  </section>`;
}

    return `<tr><td><span class="pd" style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:${PITCHES[k].color}"></span>${PITCHES[k].name}</td>
      <td>${b.n}</td><td>${pct(b.n/st.P)}</td><td>${pct(b.strikes/b.n)}</td><td>${b.swings?pct(b.whiffs/b.swings):'–'}</td><td>${b.hits} / ${b.bip}</td></tr>`; }).join('');
  const ip = o => `${Math.floor(o/3)}${o%3?` ${o%3}/3`:''}`;
  const F = g.final, DEC_CLS = {'승':'w','패':'l','세':'s','홀':'h','블론':'l'};

  const glog = g.log.slice().reverse().map(l=> l.sub ? `<li class="subl"><span class="inn">${l.inn}회</span><span>${l.text}</span></li>` : `<li><span class="inn">${l.inn}회</span><span>${l.order}. ${l.name} · <span class="${l.hit?'hit':''}">${l.text}</span> <span class="muted">(${l.np}구)</span>${l.sit?`<span class="sit ${l.hit||l.bb||l.err?'on':''}">→ ${l.sit}${l.runs&&l.score?` · ${l.score}`:''}</span>`:''}</span>${l.runs?`<span class="rr">+${l.runs}</span>`:''}</li>`).join('');
  const ch = challenge(), sub = ` · ${esc(usName())} vs ${S.mode==='legend' ? LEGEND_TEAMS[S.team].label : S.mode==='allstar' ? '올스타 타선' : esc(oppName())}`;
  const again = S.mode==='custom' ? '같은 설정으로 다시 (능력치 새로 뽑기)' : '같은 타선 다시 상대하기';
  return `<header class="mast"><div><p class="eyebrow">${MODES[S.mode].label}${sub} · ${DIFFS[S.diff].label} · ${lenLabel(S.innings)} · 투수 ${g.used.length}명 등판</p><h1>${ch?'도전 종료':F?({W:'승리',L:'패배',T:'무승부'}[F.res]+` <span class="score">${esc(usName())} <b>${F.us} : ${F.opp}</b> ${esc(oppName())}</span>`):'경기 종료'}</h1>
    ${!ch && F ? `<p class="lede">${g.inning>LAST?`연장 ${g.inning}회까지 · `:''}${Object.entries(F.dec).map(([i,d])=>`${d.join('·')} ${esc(pName(g.staff[i]))}`).join(' · ') || '기록된 투수 없음'}</p>` : ''}
    ${ch?`<p class="lede">3실점까지 <b>${fmtOuts(g.chOuts||0)}</b>을 버텼어요. ${g.chNew?(g.chPrev!=null?`최고 기록 경신! (이전 ${fmtOuts(g.chPrev)})`:'첫 기록이에요.'):`이 설정 최고 기록은 ${fmtOuts(g.chPrev)}이에요.`}</p>`:''}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" data-act="again">${again}</button><button class="ghost" data-act="rebuild">설정 바꾸기</button><button class="ghost" data-act="home">모드 선택</button></div></header>
  <div class="tiles">
    ${ch ? tile('버틴 이닝', fmtOuts(g.chOuts||0).replace('이닝',''), true) : ''}${ch?tile('실점', st.R):''}${tile('피안타율', avg3(avg))}${tile('삼진', st.K)}${tile('볼넷', st.BB)}${tile('피홈런', st.HR)}${tile('병살 유도', st.DP||0)}${tile('실책', st.E||0)}${tile('희생번트 허용', st.SH||0)}${tile('사구', st.HBP||0)}${tile('도루 허용', st.SB||0)}${tile('도루 저지', st.CS||0)}${tile('견제사', st.PK||0)}
    ${tile('투구수', st.P)}${tile('헛스윙률', st.swings?pct(st.whiffs/st.swings):'–')}${tile('스트라이크 비율', st.P?pct(st.strikes/st.P):'–')}
  </div>
  ${ch?'':resultLines()}

  <div class="rgrid">
    <section><p class="ph"><span>투수별 성적</span></p><div class="wrapx"><table class="rtable"><tr><th>투수</th><th>기록</th><th>이닝</th><th>투구</th><th>상대 타자</th><th>피안타</th><th>실점</th><th>볼넷+사구</th><th>삼진</th></tr>${prow}</table></div>
      <p class="ph" style="margin-top:18px"><span>구종별 성적</span></p><div class="wrapx"><table class="rtable"><tr><th>구종</th><th>투구</th><th>비율</th><th>스트라이크</th><th>헛스윙률</th><th>피안타/인플레이</th></tr>${rows}</table></div></section>
    <section class="panel"><p class="ph"><span>타석 기록</span><span>${st.PA}타석</span></p><ul class="glog" style="max-height:420px">${glog}</ul></section>
  </div>`;
}

// 결과 화면: 상대 타자 성적 (타순별 타석 결과 + 합계)
function batterTable(){
  const g = S.g, tot = {ab:0,h:0,hr:0,rbi:0,bb:0,k:0};
  const fa = (h,ab) => !ab ? '–' : h===ab ? '1.000' : avg3(h/ab);
  const cls = x => x.h ? (x.tok==='HR' ? 'hr' : 'h') : x.tok==='K' ? 'k' : ['BB','HBP','IBB'].includes(x.tok) ? 'bb' : '';
  const rows = g.lineup.map((b,i)=>{ const t = todayLine(i), rs = t.rs;
    const hr = rs.filter(x=>x.tok==='HR').length, rbi = rs.reduce((a,x)=>a+(x.rbi||0),0), bb = rs.filter(x=>['BB','HBP','IBB'].includes(x.tok)).length, k = rs.filter(x=>x.tok==='K').length;
    tot.ab+=t.ab; tot.h+=t.h; tot.hr+=hr; tot.rbi+=rbi; tot.bb+=bb; tot.k+=k;
    const season = b.info ? `<small class="muted">시즌 ${b.info.line.split(' / ')[0]}</small>` : '';
    return `<tr><td class="bo">${b.order}</td><td class="nm"><b>${esc(b.name)}</b> <span class="muted">${handKo(b.hand||'R')} · ${TYPE_KO[typeOf(b)]||''}</span>${season}</td>
      <td class="pas">${rs.length ? rs.map(x=>`<span class="${cls(x)}"><em>${x.inn}회</em>${esc(x.txt)}</span>`).join('') : '<span class="muted">타석 없음</span>'}</td>
      <td>${t.ab}</td><td>${t.h}</td><td>${hr}</td><td>${rbi}</td><td>${bb}</td><td>${k}</td><td class="mono">${fa(t.h,t.ab)}</td></tr>`; }).join('');
  return `<section class="bres"><p class="ph"><span>상대 타자 성적</span><span>${esc(oppName())}</span></p><div class="wrapx"><table class="rtable btable">
    <tr><th>타순</th><th>타자</th><th>타석 결과</th><th>타수</th><th>안타</th><th>홈런</th><th>타점</th><th>볼넷+사구</th><th>삼진</th><th>타율</th></tr>${rows}
    <tr class="tot"><td></td><td><b>합계</b></td><td></td><td>${tot.ab}</td><td>${tot.h}</td><td>${tot.hr}</td><td>${tot.rbi}</td><td>${tot.bb}</td><td>${tot.k}</td><td class="mono">${fa(tot.h,tot.ab)}</td></tr>
  </table></div></section>`;
}

function resultLines(){
  const g = S.g, n = Math.max(LAST, g.inning, g.our.length), aw = away(), pre = startInn();
  let h='', a='', b='';
  for (let i=1;i<=n;i++){ h+=`<th>${i}</th>`;
    const o = g.inningRuns[i-1], u = g.our[i-1];
    a += `<td class="${i<pre?'pre':''}">${o!=null ? o : (aw && u!=null ? 'X' : '')}</td>`;
    b += `<td class="${i<pre?'pre':''}">${aw ? (u ?? '') : (i<=g.inning ? (u==null?'X':u) : '')}</td>`; }
  const oppR = `<tr><td>${esc(oppName())} <span class="muted">${aw?'홈':'원정'}</span></td>${a}<td><b>${g.st.R}</b></td></tr>`;
  const usR = `<tr><td>${esc(usName())} <span class="muted">${aw?'원정':'홈'}</span></td>${b}<td><b>${ourTotal()}</b></td></tr>`;
  return `<div class="wrapx"><table class="rtable lscore"><tr><th></th>${h}<th>R</th></tr>${aw ? usR+oppR : oppR+usR}</table></div>`;
}
// ---------- 렌더 & 이벤트 ----------
function render(){
  $app.innerHTML = S.screen==='home' ? renderHome() : S.screen==='build' ? renderBuild() : S.screen==='game' ? renderGame() : renderResult();
}
function act(a){
  const [cmd, x, y] = a.split(':');
  const g = S.g;
  switch(cmd){
    case 'diff': S.diff=x; break;
    case 'innings': S.innings=+x; break;
    case 'practice': S.practice = x==='1'; break;
    case 'scout': S.scout = x==='1'; break;
    case 'edit': S.edit=+x; break;
    case 'buy': if (remain()>=PITCHES[x].cost) S.staff[S.edit].build[x]={stuff:1,ctrl:1}; break;
    case 'sell': delete S.staff[S.edit].build[x]; break;
    case 'up': { const b=S.staff[S.edit].build, L=b[x][y]; if (L<MAX_LV && remain()>=upCost(L)) b[x][y]++; break; }
    case 'down': { const b=S.staff[S.edit].build; if (b[x][y]>1) b[x][y]--; break; }
    case 'phand': S.staff[S.edit].hand = x; break;
    case 'penadd': if (S.staff.length-2 < MAX_PEN){ S.staff.splice(lastIdx(), 0, emptyPen()); relabel(); S.edit = lastIdx()-1; } break;
    case 'pendel': if (isPen(S.edit) && S.staff.length-2 > MIN_PEN){ S.staff.splice(S.edit, 1); relabel(); S.edit = Math.min(S.edit, lastIdx()-1); } break;
    case 'staup': { const p=S.staff[S.edit]; if (p.sta<MAX_LV && remain()>=upCost(p.sta)) p.sta++; break; }
    case 'stadown': { const p=S.staff[S.edit]; if (p.sta>1) p.sta--; break; }
    case 'mup': { const p=S.staff[S.edit], M=p.mental||1; if (M<MAX_LV && remain()>=upCost(M)) p.mental=M+1; break; }
    case 'mdown': { const p=S.staff[S.edit]; if ((p.mental||1)>1) p.mental--; break; }
    case 'slot': S.staff[S.edit].slot = x; break;
    case 'mode': S.mode = x; S.screen = 'build'; S.g = null; window.scrollTo(0,0); break;
    case 'home': S.screen = 'home'; S.g = null; window.scrollTo(0,0); break;
    case 'team': S.team = x; break;
    case 'sbup': case 'sbdn': { const i=+x, j = cmd==='sbup' ? i-1 : i+1, b=S.starBat; if (j>=0 && j<9) [b[i],b[j]]=[b[j],b[i]]; break; }
    case 'sbreset': S.starBat = [...STAR_BAT_DEFAULT]; break;
    case 'ha': S.homeAway = x; break;
    case 'extra': S.extra = x; break;
    case 'src': S.staffSrc = x; break;
    case 'mkcode': S.saveUi = {...(S.saveUi||{}), code: toCode(), msg:'코드를 만들었어요. 복사해서 공유하거나 보관하세요.', err:false}; break;
    case 'copycode': { const c = (S.saveUi||{}).code; if (!c) break;
      const done = ok => { S.saveUi.msg = ok ? '복사했어요.' : '복사가 막혀 있어요. 코드 칸을 눌러 전체 선택한 뒤 직접 복사하세요.'; S.saveUi.err = !ok; render(); };
      try { navigator.clipboard.writeText(c).then(()=>done(true), ()=>done(false)); } catch(e){ done(false); } return; }
    case 'loadcode': { const u = S.saveUi = S.saveUi||{};
      try { applyCustom(fromCode(u.codeIn||'')); u.msg = '코드로 설정을 불러왔어요.'; u.err = false; u.codeIn = ''; }
      catch(e){ u.msg = '불러오지 못했어요: ' + e.message; u.err = true; } break; }
    case 'savelocal': { const u = S.saveUi = S.saveUi||{}, a = loadSaves(), d = new Date();
      const name = (u.name||'').trim() || `설정 ${a.length+1}`;
      a.unshift({name, when:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`, code: toCode()});
      if (a.length>12) a.length = 12;
      u.msg = storeSaves(a) ? `"${name}" 저장했어요.` : '이 브라우저는 저장을 막고 있어요. 코드 만들기로 보관하세요.'; u.err = false; u.name = ''; break; }
    case 'loadsave': { const u = S.saveUi = S.saveUi||{}, it = loadSaves()[+x];
      try { applyCustom(fromCode(it.code)); u.msg = `"${it.name}" 불러왔어요.`; u.err = false; } catch(e){ u.msg = '불러오지 못했어요.'; u.err = true; } break; }
    case 'codesave': { const it = loadSaves()[+x]; if (it) S.saveUi = {...(S.saveUi||{}), code:it.code, msg:`"${it.name}" 코드예요.`, err:false}; break; }
    case 'delsave': { const a = loadSaves(); const it = a.splice(+x,1)[0]; storeSaves(a); S.saveUi = {...(S.saveUi||{}), msg: it?`"${it.name}" 삭제했어요.`:'', err:false}; break; }
    case 'lfill': S.lineupCfg.forEach(c=>{ if (!c.name.trim()) c.name = genName(); }); break;
    case 'lreset': S.lineupCfg = Array.from({length:9}, ()=>({name:'', hand:'auto', type:'auto', app:'auto', spd:'auto'})); break;
    case 'start': if (staffOK()){ newGame(); window.scrollTo(0,0); } break;
    case 'pen': if (g) g.pen = !g.pen; break;
    case 'pickoff': doPickoff(+x); return;
    case 'sub': if (g) substitute(+x); break;
    case 'again': newGame(); window.scrollTo(0,0); break;
    case 'rebuild': S.screen='build'; S.g=null; window.scrollTo(0,0); break;
    case 'pick': if (g && curP().build[x]) g.sel.k=x; break;
    case 'zone': if (g && !g.abOver) g.sel.z=+x; break;
    case 'overlay': g.overlay=x; break;
    case 'batview': g.batView=x; break;
    case 'throw': doThrow(); return;
    case 'ibb': if (g && !g.abOver && !g.pen){ const bat=g.lineup[g.bi]; g.last=null; g.lastDrain=null; finishPA('IBB', null);
      g.event = {big:'고의사구', tone:'', sub:`${bat.name} 1루로 걸어 나가요${g.abOver.runs?` · 밀어내기 ${g.abOver.runs}실점`:''}`}; } break;
    case 'next': nextBatter(); return;
  }
  render();
}
$app.addEventListener('click', e=>{ const t=e.target.closest('[data-act]'); if (t && !t.disabled) act(t.dataset.act); });
// 입력칸: 타이핑 중에는 다시 그리지 않아요(포커스 유지)
$app.addEventListener('input', e=>{
  const t = e.target.closest('[data-input]'); if (!t) return;
  const [cmd, i] = t.dataset.input.split(':');
  if (cmd==='pname') S.staff[S.edit].name = t.value.slice(0,12);
  else if (cmd==='lname') S.lineupCfg[+i].name = t.value.slice(0,10);
  else if (cmd==='teamus') S.teamUs = t.value.slice(0,10);
  else if (cmd==='teamopp') S.teamOpp = t.value.slice(0,10);
  else if (cmd==='savename') (S.saveUi = S.saveUi||{}).name = t.value.slice(0,20);
  else if (cmd==='codein') (S.saveUi = S.saveUi||{}).codeIn = t.value;
});
$app.addEventListener('change', e=>{
  const t = e.target.closest('[data-change]'); if (!t) return;
  const [cmd, i] = t.dataset.change.split(':'), v = t.value;
  if (cmd==='lhand') S.lineupCfg[+i].hand = v;
  else if (cmd==='ltype') S.lineupCfg[+i].type = v;
  else if (cmd==='lapp') S.lineupCfg[+i].app = v;
  else if (cmd==='lspd') S.lineupCfg[+i].spd = v;
  else if (cmd==='sbat'){ const b = S.starBat, nm = ALLSTAR_HITTERS[+v].name, j = b.findIndex((x,ii)=> ii!==+i && ALLSTAR_HITTERS[x].name===nm); if (j>=0) b[j] = b[+i]; b[+i] = +v; render(); }
  else if (cmd==='star'){ const pick = S.starPick, nm = ALLSTAR_PITCHERS[+v].name, j = pick.findIndex((x,ii)=> ii!==+i && ALLSTAR_PITCHERS[x].name===nm); if (j>=0) pick[j] = pick[+i]; pick[+i] = +v; render(); }
});
$app.addEventListener('mouseover', e=>{
  const c = e.target.closest('.fg.target .fc[data-cell]'), hl = document.getElementById('hoverline');
  if (hl) hl.textContent = c ? cellName(+c.dataset.cell, curHand()) : plateCap();
});
$app.addEventListener('keydown', e=>{
  const t=e.target.closest('.zc[data-act]');
  if (t && (e.key==='Enter')){ e.preventDefault(); act(t.dataset.act); }
});
document.addEventListener('keydown', e=>{
  if (S.screen!=='game' || e.metaKey || e.ctrlKey || e.altKey) return;
  const g = S.g;
  if (/^[1-7]$/.test(e.key)){ const k=owned()[+e.key-1]; if (k){ g.sel.k=k; render(); } return; }
  if (g.pen) return;
  const DIRS = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[1,0],ArrowRight:[-1,0]};   // 화면은 투수 시점이라 좌우가 엔진 좌표와 반대
  if (DIRS[e.key] && !g.abOver){
    e.preventDefault();
    const cur = g.sel.z==null ? 40 : g.sel.z, c = CELLS[cur], [dx,dy] = DIRS[e.key];
    let n = cur; for (let st=1; st<=4 && n===cur; st++) n = pointToCell(c.cx+dx*st, c.cy+dy*st);
    g.sel.z = n; render(); return;
  }
  if ((e.key==='i' || e.key==='I' || e.key==='ㅑ') && !g.abOver){ act('ibb'); return; }
  if (e.key===' ' || (e.key==='Enter' && !e.target.closest('[data-act]'))){
    e.preventDefault();
    if (g.pen) return;
    if (g.abOver) nextBatter(); else doThrow();
  }
});

function start(data){
  S = (data && data.screen) ? data : freshState();
  if (!S.staff){ S.staff = newStaff(); if (S.build) S.staff[0].build = S.build; delete S.build; S.edit = 0; S.g = null; S.screen = 'build'; }
  if (S.g && (!S.g.pc || !S.g.load || S.g.bases.some(x=>x===1))){ S.g = null; S.screen = 'build'; }
  S.staff.forEach((p,i)=>{ if (!p.hand) p.hand = 'R'; if (!p.slot) p.slot = 'over'; if (!p.mental) p.mental = 1; if (p.name==null) p.name = ''; });
  const F = freshState();
  for (const key of ['mode','team','staffSrc','starPick','starBat','lineupCfg','teamUs','teamOpp','homeAway','extra','scout']) if (S[key]==null) S[key] = F[key];
  if (S.staff.length < 3 || S.staff.length > 2+MAX_PEN) S.staff = newStaff();
  relabel();
  if (!Array.isArray(S.starBat) || S.starBat.length !== 9 || S.starBat.some(x=>!ALLSTAR_HITTERS[x])) S.starBat = [...STAR_BAT_DEFAULT];
  if (S.starPick.length !== 6 || S.starVer !== F.starVer || S.starPick.some(x=>!ALLSTAR_PITCHERS[x])){ S.starPick = F.starPick; S.starVer = F.starVer; }
  if (!DIFFS[S.diff]){ if (S.diff==='scout') S.scout = true; S.diff = 'hard'; }
  if (S.edit >= 6) S.edit = 0;
  if (S.g && (!S.g.tl || S.g.v!==2)){ S.g = null; if (S.screen!=='home') S.screen = 'build'; }
  if (S.g && !S.g.staff){ S.g = null; S.screen = 'build'; }
  if (S.g && S.g.lineup[0].hit.length !== NCELL){ S.g = null; S.screen = 'build'; }
  render();
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
